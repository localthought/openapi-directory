openapi: 3.0.0
info:
  title: GitLab REST API (read-only subset)
  version: v4-readonly
  description: Read-only GitLab.com subset for project discovery and issue synchronization. The project
    list retains GitLab's membership filter; consumers can select projects with membership=true. Based
    on GitLab's official OpenAPI 3.0 source, pinned and preserved in source/openapi_v3.yaml. Only GitLab.com
    is represented; self-managed instance hosts are not included. The official Issues API reference describes
    the list response as a collection; this subset corrects a single-object response shape in the pinned
    upstream OAS.
  termsOfService: https://handbook.gitlab.com/handbook/legal/api-terms/
  license:
    name: CC BY-SA 4.0
    url: https://gitlab.com/gitlab-org/gitlab/-/blob/master/LICENSE
    x-gitlab-description: The license applies to the OpenAPI specification document itself. For terms
      governing use of the GitLab API, see the termsOfService field.
  x-origin:
  - format: openapi
    url: https://gitlab.com/gitlab-org/gitlab/-/raw/e8b0b4728b9a69a9767a623ca6bf745998061b78/doc/api/openapi/openapi_v3.yaml
    version: '19.5'
  x-providerName: gitlab.com
  x-serviceName: v4-readonly
servers:
- url: https://gitlab.com/api/v4
  description: GitLab.com REST API v4
security:
- http: []
- oauth2:
  - read_api
- apiKey: []
paths:
  /projects:
    get:
      operationId: getApiV4Projects
      summary: List all projects
      description: Lists all projects. Unauthenticated requests return only public projects with a limited
        subset of attributes. You can filter responses by custom attributes. To use the `updated_after`
        or `updated_before` filters, you must also set `order_by` to `updated_at`.
      tags:
      - Projects
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/APIEntitiesBasicProjectDetails'
        '400':
          description: Bad request
      parameters:
      - name: order_by
        required: false
        description: Return projects ordered by field. storage_size, repository_size, wiki_size, packages_size
          are only available to admins. Similarity is available when searching and is limited to projects
          the user has access to.
        schema:
          type: string
          enum:
          - id
          - name
          - path
          - created_at
          - updated_at
          - last_activity_at
          - similarity
          - star_count
          - storage_size
          - repository_size
          - wiki_size
          - packages_size
          default: created_at
        in: query
      - name: sort
        required: false
        description: Sort results in ascending or descending order.
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
        in: query
      - name: archived
        required: false
        description: If `true`, returns only archived projects.
        schema:
          type: boolean
          nullable: true
        in: query
      - name: visibility
        required: false
        description: Return projects with the specified visibility.
        schema:
          type: string
          enum:
          - private
          - internal
          - public
          nullable: true
        in: query
      - name: search
        required: false
        description: 'Return a list of projects with a `path`, `name`, or `description` matching the search
          criteria (case-insensitive, substring match). Multiple terms can be provided, separated by an
          escaped space, either `+` or `%20`, and are ANDed together. Example: `one+two` matches substrings
          `one` and `two` (in any order).'
        schema:
          type: string
          nullable: true
        in: query
      - name: search_namespaces
        required: false
        description: If `true`, includes ancestor namespaces when matching search criteria.
        schema:
          type: boolean
          nullable: true
        in: query
      - name: owned
        required: false
        description: If `true`, returns only projects explicitly owned by the current user.
        schema:
          type: boolean
          default: false
        in: query
      - name: starred
        required: false
        description: If `true`, returns only projects starred by the current user.
        schema:
          type: boolean
          default: false
        in: query
      - name: imported
        required: false
        description: If `true`, returns only projects that were imported from external systems by the
          authenticated user.
        schema:
          type: boolean
          default: false
        in: query
      - name: membership
        required: false
        description: If `true`, returns only projects that the current user is a member of.
        schema:
          type: boolean
          default: false
        in: query
      - name: with_issues_enabled
        required: false
        description: If `true`, returns only projects that have the issues feature enabled.
        schema:
          type: boolean
          default: false
        in: query
      - name: with_merge_requests_enabled
        required: false
        description: If `true`, returns only projects that have the merge requests feature enabled.
        schema:
          type: boolean
          default: false
        in: query
      - name: with_programming_language
        required: false
        description: Return projects that use the given programming language.
        schema:
          type: string
          nullable: true
        in: query
      - name: min_access_level
        required: false
        description: Return results where the current user has at least the specified access level. For
          a list of values, see [roles](https://docs.gitlab.com/user/permissions/#default-roles).
        schema:
          type: integer
          enum:
          - 10
          - 15
          - 20
          - 25
          - 30
          - 40
          - 50
          nullable: true
        in: query
      - name: id_after
        required: false
        description: Return projects with IDs greater than the specified ID.
        schema:
          type: integer
          nullable: true
        in: query
      - name: id_before
        required: false
        description: Return projects with IDs less than the specified ID.
        schema:
          type: integer
          nullable: true
        in: query
      - name: last_activity_after
        required: false
        description: Return projects with last activity after the specified time.
        schema:
          type: string
          format: date-time
          nullable: true
        in: query
      - name: last_activity_before
        required: false
        description: Return projects with last activity before the specified time.
        schema:
          type: string
          format: date-time
          nullable: true
        in: query
      - name: repository_storage
        required: false
        description: Return projects stored on the specified repository storage shard. Administrators
          only.
        schema:
          type: string
          nullable: true
        in: query
      - name: topic
        required: false
        description: Comma-separated list of topics. Return projects having all topics.
        schema:
          type: array
          items:
            type: string
          nullable: true
        in: query
        style: form
        explode: false
      - name: topic_id
        required: false
        description: Filter projects by the given topic ID.
        schema:
          type: integer
          nullable: true
        in: query
      - name: updated_before
        required: false
        description: Return projects last updated on or before the specified time.
        schema:
          type: string
          format: date-time
          nullable: true
        in: query
      - name: updated_after
        required: false
        description: Return projects last updated on or after the specified time.
        schema:
          type: string
          format: date-time
          nullable: true
        in: query
      - name: include_pending_delete
        required: false
        description: If `true`, includes projects that are pending deletion in the response. Administrators
          only.
        schema:
          type: boolean
          nullable: true
        in: query
      - name: marked_for_deletion_on
        required: false
        description: Return projects that are marked for deletion on this date. Premium and Ultimate only.
          [Introduced](https://gitlab.com/gitlab-org/gitlab/-/issues/463939) in GitLab 17.1.
        schema:
          type: string
          format: date
          nullable: true
        in: query
      - name: active
        required: false
        description: If `true`, returns only projects that are not archived and not marked for deletion.
        schema:
          type: boolean
          nullable: true
        in: query
      - name: wiki_checksum_failed
        required: false
        description: If `true`, returns only projects whose wiki checksum calculation failed. Premium
          and Ultimate only.
        schema:
          type: boolean
          default: false
        in: query
      - name: repository_checksum_failed
        required: false
        description: If `true`, returns only projects whose repository checksum calculation failed. Premium
          and Ultimate only.
        schema:
          type: boolean
          default: false
        in: query
      - name: include_hidden
        required: false
        description: If `true`, includes hidden projects. Administrators only. Premium and Ultimate only.
        schema:
          type: boolean
          default: false
        in: query
      - name: page
        required: false
        description: Page number of results to retrieve.
        schema:
          type: integer
          default: 1
        in: query
        example: 1
      - name: per_page
        required: false
        description: Number of items to list per page.
        schema:
          type: integer
          default: 20
        in: query
        example: 20
      - name: simple
        required: false
        description: If `true`, returns only limited fields for each project. Without authentication,
          only limited fields are returned regardless of this setting.
        schema:
          type: boolean
          default: false
        in: query
      - name: statistics
        required: false
        description: If `true`, includes project statistics. Available only to users with the Reporter,
          Developer, Maintainer, or Owner role.
        schema:
          type: boolean
          default: false
        in: query
      - name: with_custom_attributes
        required: false
        description: If `true`, includes [custom attributes](https://docs.gitlab.com/api/custom_attributes/)
          in the response. Administrators only.
        schema:
          type: boolean
          default: false
        in: query
      - name: custom_attributes
        required: false
        description: Filter by [custom attributes](https://docs.gitlab.com/api/custom_attributes/) that
          match all of the specified key and value pairs. Administrators only.
        schema:
          type: object
          nullable: true
        in: query
  /projects/{id}/issues:
    get:
      operationId: getApiV4ProjectsIdIssues
      summary: List all project issues
      description: Lists all issues for a specified project. If the project is private, you need to provide
        credentials to authorize. In most cases, you should authenticate with a personal access token.
      tags:
      - Projects
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/APIEntitiesIssue'
        '404':
          description: Not Found
        '400':
          description: Bad Request
      parameters:
      - name: id
        required: true
        description: ID or URL-encoded path of the project.
        schema:
          oneOf:
          - type: string
          - type: integer
        in: path
      - name: with_labels_details
        required: false
        description: 'If `true`, the response returns more details for each label in the labels field:
          `name`, `color`, `description`, `description_html`, `text_color`.'
        schema:
          type: boolean
          default: false
        in: query
      - name: state
        required: false
        description: Filter issues by state.
        schema:
          type: string
          enum:
          - opened
          - closed
          - all
          default: all
        in: query
      - name: closed_by_id
        required: false
        description: Return issues closed by the user with the given ID.
        schema:
          type: integer
          nullable: true
        in: query
      - name: order_by
        required: false
        description: Sort results by the specified field.
        schema:
          type: string
          enum:
          - created_at
          - due_date
          - label_priority
          - milestone_due
          - popularity
          - priority
          - relative_position
          - title
          - updated_at
          - weight
          default: created_at
        in: query
      - name: sort
        required: false
        description: Sort results in ascending or descending order.
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
        in: query
      - name: due_date
        required: false
        description: Return issues that have no due date, are overdue, or whose due date is this week,
          this month, or between two weeks ago and next month.
        schema:
          type: string
          enum:
          - '0'
          - any
          - today
          - tomorrow
          - overdue
          - week
          - month
          - next_month_and_previous_two_weeks
          - ''
          nullable: true
        in: query
      - name: issue_type
        required: false
        description: 'The type of the issue. Accepts: issue, incident, test_case, requirement, task, ticket'
        schema:
          type: string
          enum:
          - issue
          - incident
          - test_case
          - requirement
          - task
          - ticket
          nullable: true
        in: query
      - name: labels
        required: false
        description: Comma-separated list of label names. `None` means no labels are assigned. `Any` means
          at least one label is assigned. `No+Label` (deprecated) means no labels are assigned. Set to
          an empty string to unassign all labels. If a label does not already exist, this creates a new
          project label and assigns it to the issue. Predefined names are case-insensitive.
        schema:
          type: array
          items:
            type: string
          nullable: true
        in: query
        style: form
        explode: false
      - name: milestone
        required: false
        description: Milestone title. `None` lists all issues with no milestone. `Any` lists all issues
          that have an assigned milestone. Support for `None` and `Any` is [planned for removal](https://gitlab.com/gitlab-org/gitlab/-/issues/336044).
          Use the `milestone_id` attribute instead. Mutually exclusive with `milestone_id`.
        schema:
          type: string
          nullable: true
        in: query
      - name: milestone_id
        required: false
        description: Return issues assigned to milestones with a given timebox value. `None` lists all
          issues with no milestone. `Any` lists all issues that have an assigned milestone. `Upcoming`
          lists all issues assigned to milestones due in the future. `Started` lists all issues assigned
          to open, started milestones. The logic for `Upcoming` and `Started` differs from the logic used
          in the [GraphQL API](https://docs.gitlab.com/user/project/milestones/#special-milestone-filters).
          Mutually exclusive with `milestone`.
        schema:
          type: string
          enum:
          - Any
          - None
          - Upcoming
          - Started
          nullable: true
        in: query
      - name: iids
        required: false
        description: Return only the issues having the given `iid`.
        schema:
          type: array
          items:
            type: integer
          nullable: true
        in: query
        style: form
        explode: false
      - name: search
        required: false
        description: Search issues against their `title` and `description`.
        schema:
          type: string
          nullable: true
        in: query
      - name: in
        required: false
        description: Modify the scope of the `search` attribute to `title`, `description`, or `title,description`.
          If omitted, defaults to `title,description`.
        schema:
          type: string
          nullable: true
        in: query
      - name: author_id
        required: false
        description: Return issues created by the given user ID. Combine with `scope=all` or `scope=assigned_to_me`.
          Mutually exclusive with `author_username`.
        schema:
          type: integer
          nullable: true
        in: query
      - name: author_username
        required: false
        description: Return issues created by the given `username`. Mutually exclusive with `author_id`.
        schema:
          type: string
          nullable: true
        in: query
      - name: assignee_id
        required: false
        description: Return issues assigned to the given user `id`. `None` returns unassigned issues and
          `Any` returns issues with an assignee. Mutually exclusive with `assignee_username`.
        schema:
          oneOf:
          - type: integer
            nullable: true
          - type: string
            nullable: true
        in: query
      - name: assignee_username
        required: false
        description: Return issues assigned to the given username. In GitLab Community Edition, only a
          single value is accepted. Otherwise, an invalid parameter error is returned. When multiple usernames
          are given, only issues assigned to all of them are returned. Mutually exclusive with `assignee_id`.
        schema:
          type: array
          items:
            type: string
          nullable: true
        in: query
      - name: created_after
        required: false
        description: Return issues created on or after the specified time.
        schema:
          type: string
          format: date-time
          nullable: true
        in: query
      - name: created_before
        required: false
        description: Return issues created on or before the specified time.
        schema:
          type: string
          format: date-time
          nullable: true
        in: query
      - name: updated_after
        required: false
        description: Return issues updated on or after the specified time.
        schema:
          type: string
          format: date-time
          nullable: true
        in: query
      - name: updated_before
        required: false
        description: Return issues updated on or before the specified time.
        schema:
          type: string
          format: date-time
          nullable: true
        in: query
      - name: not
        required: false
        description: Return issues that do not match the specified parameters.
        schema:
          type: object
          nullable: true
        in: query
      - name: not[labels]
        required: false
        description: Comma-separated list of label names.
        schema:
          type: array
          items:
            type: string
          nullable: true
        in: query
      - name: not[milestone]
        required: false
        description: Milestone title. Mutually exclusive with `not[milestone_id]`.
        schema:
          type: string
          nullable: true
        in: query
      - name: not[milestone_id]
        required: false
        description: Return issues assigned to milestones without the specified timebox value. Mutually
          exclusive with `not[milestone]`.
        schema:
          type: string
          enum:
          - Any
          - None
          - Upcoming
          - Started
          nullable: true
        in: query
      - name: not[iids]
        required: false
        description: Internal IDs of issues to exclude.
        schema:
          type: array
          items:
            type: integer
          nullable: true
        in: query
      - name: not[author_id]
        required: false
        description: Return issues not authored by the user with the given ID. Mutually exclusive with
          `not[author_username]`.
        schema:
          type: integer
          nullable: true
        in: query
      - name: not[author_username]
        required: false
        description: Return issues not authored by the user with the given username. Mutually exclusive
          with `not[author_id]`.
        schema:
          type: string
          nullable: true
        in: query
      - name: not[assignee_id]
        required: false
        description: Return issues not assigned to the user with the given ID. Mutually exclusive with
          `not[assignee_username]`.
        schema:
          type: integer
          nullable: true
        in: query
      - name: not[assignee_username]
        required: false
        description: Return issues not assigned to the user with the given username. Mutually exclusive
          with `not[assignee_id]`.
        schema:
          type: array
          items:
            type: string
          nullable: true
        in: query
      - name: not[weight]
        required: false
        description: Return issues that do not have the specified weight.
        schema:
          type: integer
          nullable: true
        in: query
      - name: not[iteration_id]
        required: false
        description: Return issues not assigned to the iteration with the given ID. Mutually exclusive
          with `not[iteration_title]`.
        schema:
          oneOf:
          - type: integer
            nullable: true
          - type: string
            nullable: true
        in: query
      - name: not[iteration_title]
        required: false
        description: Return issues not assigned to the iteration with the given title. Mutually exclusive
          with `not[iteration_id]`.
        schema:
          type: string
          nullable: true
        in: query
      - name: scope
        required: false
        description: Return issues for the given scope.
        schema:
          type: string
          enum:
          - created-by-me
          - assigned-to-me
          - created_by_me
          - assigned_to_me
          - all
          nullable: true
        in: query
      - name: my_reaction_emoji
        required: false
        description: Return issues reacted to by the authenticated user with the given `emoji`. `None`
          returns issues with no reaction and `Any` returns issues with at least one reaction.
        schema:
          type: string
          nullable: true
        in: query
      - name: confidential
        required: false
        description: If `true`, returns only confidential issues. If `false`, returns only public issues.
        schema:
          type: boolean
          nullable: true
        in: query
      - name: weight
        required: false
        description: The weight of the issue
        schema:
          oneOf:
          - type: integer
            nullable: true
          - type: string
            nullable: true
        in: query
      - name: epic_id
        required: false
        description: Return issues associated with the epic with the given ID. `None` returns issues that
          are not associated with an epic. `Any` returns issues that are associated with an epic. Premium
          and Ultimate only.
        schema:
          oneOf:
          - type: integer
            nullable: true
          - type: string
            nullable: true
        in: query
      - name: health_status
        required: false
        description: 'The health status of the issue. Must be one of: on_track, needs_attention, at_risk,
          none, any'
        schema:
          type: string
          enum:
          - on_track
          - needs_attention
          - at_risk
          - none
          - any
          nullable: true
        in: query
      - name: iteration_id
        required: false
        description: Return issues assigned to the iteration with the given ID. `None` returns issues
          that do not belong to an iteration. `Any` returns issues that belong to an iteration. Premium
          and Ultimate only. Mutually exclusive with `iteration_title`.
        schema:
          oneOf:
          - type: integer
            nullable: true
          - type: string
            nullable: true
        in: query
      - name: iteration_title
        required: false
        description: Return issues assigned to the iteration with the given title. Premium and Ultimate
          only. Mutually exclusive with `iteration_id`.
        schema:
          type: string
          nullable: true
        in: query
      - name: page
        required: false
        description: Page number of results to retrieve.
        schema:
          type: integer
          default: 1
        in: query
        example: 1
      - name: per_page
        required: false
        description: Number of items to list per page.
        schema:
          type: integer
          default: 20
        in: query
        example: 20
      - name: cursor
        required: false
        description: Cursor for obtaining the next set of records.
        schema:
          type: string
          nullable: true
        in: query
  /projects/{id}/issues/{issue_iid}:
    get:
      operationId: getApiV4ProjectsIdIssuesIssueIid
      summary: Retrieve a project issue
      description: Retrieves a specified issue for a project. If the project is private or the issue is
        confidential, you need to provide credentials to authorize. In most cases, you should authenticate
        with a personal access token.
      tags:
      - Projects
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIEntitiesIssue'
        '404':
          description: Not Found
        '400':
          description: Bad Request
      parameters:
      - name: id
        required: true
        description: ID or URL-encoded path of the project.
        schema:
          oneOf:
          - type: string
          - type: integer
        in: path
      - name: issue_iid
        required: true
        description: Internal ID of the issue.
        schema:
          type: integer
        in: path
components:
  schemas:
    APIEntitiesIssue:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 84
        iid:
          type: integer
          example: 14
        project_id:
          type: integer
          format: int64
          example: 4
        title:
          type: string
          example: Impedit et ut et dolores vero provident ullam est
        description:
          type: string
          example: Repellendus impedit et vel velit dignissimos.
        state:
          type: string
          example: closed
        created_at:
          type: string
          format: date-time
          example: '2022-08-17T12:46:35.053Z'
        updated_at:
          type: string
          format: date-time
          example: '2022-11-14T17:22:01.470Z'
        closed_at:
          type: string
          format: date-time
          example: '2022-11-15T08:30:55.232Z'
        closed_by:
          $ref: '#/components/schemas/APIEntitiesUserBasic'
        labels:
          type: array
          example:
          - bug
          items:
            type: string
        milestone:
          $ref: '#/components/schemas/APIEntitiesMilestone'
        assignees:
          $ref: '#/components/schemas/APIEntitiesUserBasic'
        author:
          $ref: '#/components/schemas/APIEntitiesUserBasic'
        type:
          type: string
          description: The type of the issue.
          enum:
          - ISSUE
          - INCIDENT
          - TEST_CASE
          - REQUIREMENT
          - TASK
          - TICKET
          example: ISSUE
        assignee:
          $ref: '#/components/schemas/APIEntitiesUserBasic'
        user_notes_count:
          type: integer
        merge_requests_count:
          type: integer
        upvotes:
          type: integer
        downvotes:
          type: integer
        start_date:
          type: string
          format: date
          example: '2022-11-18'
        due_date:
          type: string
          format: date
          example: '2022-11-20'
        confidential:
          type: boolean
        discussion_locked:
          type: boolean
        issue_type:
          type: string
          example: issue
        web_url:
          type: string
          example: http://example.com/example/example/issues/14
        time_stats:
          $ref: '#/components/schemas/APIEntitiesIssuableTimeStats'
