openapi: 3.0.0
info:
  version: 0.0.1
  title: Snowflake Schema API
  description: The Snowflake Schema API is a REST API that you can use to access, update, and perform certain actions on a Snowflake schema.
  contact:
    name: Snowflake, Inc.
    url: https://snowflake.com
    email: support@snowflake.com
  x-origin:
    - format: openapi
      url: https://raw.githubusercontent.com/snowflakedb/snowflake-rest-api-specs/990e25d97236a11826c9eed40e587c2b859e5680/specifications/schema.yaml
      version: '3.0'
  x-conversion:
    - Fetched from https://raw.githubusercontent.com/snowflakedb/snowflake-rest-api-specs/990e25d97236a11826c9eed40e587c2b859e5680/specifications/schema.yaml at commit 990e25d97236a11826c9eed40e587c2b859e5680; entry source SHA-256 55cb1ed07a87208e9bfd170c333670f1d9e95e979b94e8ed6d018155b8b90dfd.
    - Bundled 2 pinned repository files with @redocly/cli 2.57.0, using bundle and an empty configuration; distinct components with conflicting basenames are renamed, not merged; 0 warnings. Source-file snapshot SHA-256 08d1eb8d0ace124c5bcee97d79786314e6839aea6ab17e5a17e9e10548411309.
    - Serialized as YAML with PyYAML 6.0.3; no OpenAPI version conversion.
servers:
  - description: Snowflake Schema API
    url: https://org-account.snowflakecomputing.com
security:
  - KeyPair: []
  - ExternalOAuth: []
  - SnowflakeOAuth: []
  - ProgrammaticAccessToken: []
paths:
  /api/v2/databases/{database}/schemas:
    get:
      summary: List schemas.
      tags:
        - schema
      description: Lists the accessible schemas.
      operationId: listSchemas
      parameters:
        - $ref: '#/components/parameters/database'
        - $ref: '#/components/parameters/like'
        - $ref: '#/components/parameters/startsWith'
        - $ref: '#/components/parameters/showLimit'
        - $ref: '#/components/parameters/fromName'
        - name: history
          in: query
          description: 'Whether to include dropped schemas that have not yet been purged. Default: `false`.'
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Successful request.
          headers:
            X-Snowflake-Request-ID:
              $ref: '#/components/headers/X-Snowflake-Request-ID'
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Schema'
        '202':
          $ref: '#/components/responses/202SuccessAcceptedResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '405':
          $ref: '#/components/responses/405MethodNotAllowed'
        '408':
          $ref: '#/components/responses/408RequestTimeout'
        '409':
          $ref: '#/components/responses/409Conflict'
        '410':
          $ref: '#/components/responses/410Gone'
        '429':
          $ref: '#/components/responses/429LimitExceeded'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
        '504':
          $ref: '#/components/responses/504GatewayTimeout'
    post:
      summary: Create a schema.
      tags:
        - schema
      description: Creates a schema, with modifiers as query parameters. You must provide the full schema definition when creating a schema.
      operationId: createSchema
      parameters:
        - $ref: '#/components/parameters/database'
        - $ref: '#/components/parameters/createMode'
        - name: kind
          in: query
          description: Type of schema to create. Currently, Snowflake supports only `transient` and `permanent` (also represented by the empty string).
          schema:
            type: string
            default: ''
          deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Schema'
      responses:
        '200':
          $ref: '#/components/responses/200SuccessResponse'
        '202':
          $ref: '#/components/responses/202SuccessAcceptedResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '405':
          $ref: '#/components/responses/405MethodNotAllowed'
        '408':
          $ref: '#/components/responses/408RequestTimeout'
        '409':
          $ref: '#/components/responses/409Conflict'
        '410':
          $ref: '#/components/responses/410Gone'
        '429':
          $ref: '#/components/responses/429LimitExceeded'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
        '504':
          $ref: '#/components/responses/504GatewayTimeout'
  /api/v2/databases/{database}/schemas/{name}:clone:
    post:
      summary: Clone a schema.
      tags:
        - schema
      description: Clones an existing schema, with modifiers as query parameters. You must provide the full schema definition when cloning an existing schema.
      operationId: cloneSchema
      parameters:
        - $ref: '#/components/parameters/database'
        - $ref: '#/components/parameters/name'
        - $ref: '#/components/parameters/createMode'
        - name: kind
          in: query
          description: Type of schema to clone. Currently, Snowflake supports only `transient` and `permanent` (also represented by the empty string).
          schema:
            type: string
            default: ''
          deprecated: true
        - name: targetDatabase
          in: query
          description: Database of the newly created schema. Defaults to the source schema's database.
          schema:
            $ref: '#/components/schemas/Identifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchemaClone'
      responses:
        '200':
          $ref: '#/components/responses/200SuccessResponse'
        '202':
