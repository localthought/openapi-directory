  /api/v2/databases/{database}/schemas/{schema}/tasks/{name}:get-tags:
    get:
      summary: Get the tag assignments for the task.
      tags:
        - task
      description: Returns all tags assigned to the task. This operation requires an active warehouse.
      operationId: getTags
      parameters:
        - $ref: '#/components/parameters/database'
        - $ref: '#/components/parameters/schema'
        - $ref: '#/components/parameters/name'
        - $ref: '#/components/parameters/withLineage'
      responses:
        '200':
          description: successful
          headers:
            X-Snowflake-Request-ID:
              $ref: '#/components/headers/X-Snowflake-Request-ID'
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TagAssignment'
        '202':
          $ref: '#/components/responses/202SuccessAcceptedResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '405':
          $ref: '#/components/responses/405MethodNotAllowed'
        '429':
          $ref: '#/components/responses/429LimitExceeded'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
        '504':
          $ref: '#/components/responses/504GatewayTimeout'
components:
  schemas:
    TaskRun:
      type: object
      description: A task run executing a standalone task or a DAG of tasks starting from the root task.
      properties:
        root_task_name:
          type: string
          description: The name of the root task in the current task run.
          readOnly: true
        database_name:
          type: string
          description: The name of the current database for the task run.
          readOnly: true
        schema_name:
          type: string
          description: The name of the current schema for the task run.
          readOnly: true
        state:
          type: string
          description: The current state of the task run.
          enum:
            - SCHEDULED
            - EXECUTING
            - SUCCEEDED
            - FAILED
            - CANCELLED
            - SKIPPED
          readOnly: true
        first_error_task_name:
          type: string
          description: The name of the first task throwing an error in the task run.
          readOnly: true
        first_error_code:
          type: integer
          description: The first error code thrown in the task run.
          readOnly: true
        first_error_message:
          type: string
          description: The first error message thrown in the task run.
          readOnly: true
        scheduled_time:
          type: string
          description: The scheduled time for the task run.
          format: date-time
          readOnly: true
        query_start_time:
          type: string
          description: The start time for the task run query.
          format: date-time
          readOnly: true
        next_scheduled_time:
          type: string
          description: The next upcoming time for the task run.
          format: date-time
          readOnly: true
        completed_time:
          type: string
          description: The time this task run was last completed.
          format: date-time
          readOnly: true
        root_task_id:
          type: string
          description: The unique task ID for the root task.
          readOnly: true
        graph_version:
          type: integer
          description: The current version of the DAG on the task run.
          readOnly: true
        run_id:
          type: integer
          description: The unique ID for the current task run.
          readOnly: true
      example:
        root_task_name: root_task
        database_name: test_db
        schema_name: test_schema
        state: SCHEDULED
        first_error_task_name: test_task
        first_error_code: 0
        first_error_message: ERROR
        scheduled_time: '2024-06-18T01:01:01.111111'
        query_start_time: '2024-06-18T01:01:01.111111'
        next_scheduled_time: '2024-06-18T01:01:01.111111'
        completed_time: '2024-06-18T01:01:01.111111'
        root_task_id: '0'
        graph_version: 0
        run_id: 0
      required:
        - root_task_name
        - database_name
        - schema_name
        - state
        - scheduled_time
        - root_task_id
        - graph_version
        - run_id
    Task:
      type: object
      description: A Snowflake task, used to execute SQL code.
      properties:
        name:
          allOf:
            - $ref: '#/components/schemas/Identifier'
          description: String that specifies the identifier (i.e. name) for the task.
        warehouse:
          allOf:
            - $ref: '#/components/schemas/Identifier'
          description: Specifies the virtual warehouse that provides compute resources for task runs. Omit this parameter to use serverless compute resources for runs of this task.
        schedule:
          $ref: '#/components/schemas/TaskSchedule'
          description: Specifies the schedule for periodically running the task.
        comment:
          type: string
          description: Specifies a comment for the task.
        finalize:
          type: string
          description: Specifies the name of the root task that the finalizer task is associated with.
        task_auto_retry_attempts:
          type: integer
          description: Root task settable only. Specifies the number of automatic task graph retry attempts. Valid range is 0 to 30. When not specified, no retry would happen.
          minimum: 0
          maximum: 30
        config:
          type: object
          additionalProperties: true
          description: Task Config
        session_parameters:
          type: object
          additionalProperties: true
          description: Session Parameters for the task at runtime.
        definition:
          type: string
          description: The SQL definition for the task. Any one of single SQL statement, call to stored procedure, or procedural logic using Snowflake scripting.
        predecessors:
          type: array
          description: Specifies one or more predecessor tasks for the current task
          items:
            type: string
            description: The identifier for the task.
        task_relations:
          type: string
          description: Displays the relationship between the root task and its corresponding finalizer tasks.
          readOnly: true
        user_task_managed_initial_warehouse_size:
          type: string
          description: Specifies the size of the compute resources to provision for the first run of the task. This parameter only applies to serverless tasks.
        target_completion_interval:
          $ref: '#/components/schemas/MinutesSchedule'
          description: Specifies the desired task completion time. This parameter only applies to serverless tasks.
        serverless_task_min_statement_size:
          type: string
          description: Specifies the minimum allowed warehouse size for the serverless task. Minimum XSMALL, Maximum XXLARGE. This parameter only applies to serverless tasks.
        serverless_task_max_statement_size:
          type: string
          description: Specifies the maximum allowed warehouse size for the serverless task. Minimum XSMALL, Maximum XXLARGE. This parameter only applies to serverless tasks.
        user_task_timeout_ms:
          type: integer
          description: Specifies the time limit on a single run of the task before it times out (in milliseconds).
        suspend_task_after_num_failures:
          type: integer
          description: Specifies the number of consecutive failed task runs after which the current task is suspended automatically.
        user_task_minimum_trigger_interval_in_seconds:
          type: integer
          description: Specifies the minimum number of seconds between triggered runs of this task. Only applies to triggered tasks. Valid range 10 to 604800.
          minimum: 10
          maximum: 604800
        condition:
          type: string
          description: Specifies a Boolean SQL expression condition; multiple conditions joined with AND/OR are supported
        allow_overlapping_execution:
          type: boolean
          description: Specifies whether to allow multiple instances of the DAG to run concurrently.
        error_integration:
          type: string
          description: Specifies the name of the notification integration used to communicate with Amazon SNS, MS Azure Event Grid, or Google Pub/Sub.
        success_integration:
          type: string
          description: Specifies the name of the notification integration used for success notifications when the task graph completes successfully.
        overlap_policy:
          type: string
          description: Specifies the overlap policy for the task graph. Only applicable to root tasks.
          enum:
            - NO_OVERLAP
            - ALLOW_CHILD_OVERLAP
            - ALLOW_ALL_OVERLAP
        execute_as_user:
          type: string
          description: Specifies the name of the user whose privileges are used to run the task.
        created_on:
          type: string
          description: The time the task was created on.
          format: date-time
          readOnly: true
        id:
          type: string
          description: An ID for the current task.
          readOnly: true
        owner:
          type: string
          description: The role that owns the task.
          readOnly: true
        owner_role_type:
          type: string
          description: The role type of the task owner.
          readOnly: true
        state:
          type: string
          description: The state of the task. Must be one of started or suspended.
          readOnly: true
          enum:
            - started
            - suspended
        last_committed_on:
          type: string
          description: The time the task was last committed on.
          readOnly: true
          format: date-time
        last_suspended_on:
          type: string
          description: The time the task was last suspended on.
          readOnly: true
          format: date-time
        database_name:
          type: string
          description: The name of the parent database for the task.
          readOnly: true
        schema_name:
          type: string
          description: The name of the parent schema for the task.
          readOnly: true
      example:
        name: name_example
        schedule:
          schedule_type: MINUTES_TYPE
          minutes: 10
        comment: test_comment
        config:
          output_dir: /temp/test_directory/
          learning_rate: '0.1'
        definition: this task does...
        predecessors:
          - task1
          - task2
          - task3
        user_task_managed_initial_warehouse_size: SMALL
        target_completion_interval:
          schedule_type: MINUTES_TYPE
          minutes: 5
        serverless_task_min_statement_size: XSMALL
        serverless_task_max_statement_size: MEDIUM
        user_task_timeout_ms: 10
        suspend_task_after_num_failures: 3
        condition: select 1
        allow_overlapping_execution: false
        error_integration: my_notification_int
        success_integration: my_success_notification_int
        overlap_policy: NO_OVERLAP
        execute_as_user: my_user
        created_on: '2024-06-18T01:01:01.111111'
        id: task_id
        owner: TASK_ADMIN
        owner_role_type: ADMIN
        state: started
        last_committed_on: '2024-06-18T01:01:01.111111'
        last_suspended_on: '2024-06-18T01:01:01.111111'
        database_name: TESTDB
        schema_name: TESTSCHEMA
      required:
        - name
        - definition
    TaskSchedule:
      type: object
      description: Specifies the schedule for periodically running the task.
      properties:
        schedule_type:
          description: Type of the schedule, can be either CRON_TYPE or MINUTES_TYPE.
          type: string
      discriminator:
        propertyName: schedule_type
        mapping:
          CRON_TYPE: CronSchedule
          MINUTES_TYPE: MinutesSchedule
    CronSchedule:
      description: A cron schedule for executing a task at a specified interval.
      allOf:
        - $ref: '#/components/schemas/TaskSchedule'
      properties:
        cron_expr:
          type: string
          description: A cron expression for the task execution.
        timezone:
          type: string
          description: The time zone for the schedule.
      example:
        cron_expr: '* * * * ? *'
        timezone: america/los_angeles
      required:
        - cron_expr
        - timezone
    MinutesSchedule:
      description: A schedule for executing a task at specified intervals of minutes (with optional sub-minute remainder in seconds).
      allOf:
        - $ref: '#/components/schemas/TaskSchedule'
      properties:
        minutes:
          type: integer
          description: The number of whole minutes between each task run.
        seconds:
          type: integer
          minimum: 0
          maximum: 59
          description: Additional seconds past `minutes` between each task run. Combined with `minutes`, the total interval is `minutes * 60 + seconds` seconds. When omitted in a request, the server treats the remainder as 0.
      example:
        minutes: 10
      required:
        - minutes
    Identifier:
      type: string
      description: A Snowflake object identifier. If the identifier contains spaces or special characters, the entire string must be enclosed in double quotes. Identifiers enclosed in double quotes are also case-sensitive.
      pattern: ^"([^"]|"")+"|[a-zA-Z_][a-zA-Z0-9_$]*$|^[$][0-9]+$
      example: TEST_NAME
    SuccessAcceptedResponse:
      type: object
      description: Schema for a request in progress response returned by the server.
      properties:
        code:
          type: string
          description: Message code returned by the server.
        message:
          type: string
          description: Message returned by the server
        resultHandler:
          type: string
          description: Opaque result ID used for checking for request completion through one or more subsequent completion check operations.
        job_id:
          type: string
          description: ID of the job/query backing the in-progress request. This is the result handler without the trailing result-type indicator appended to it.
      example:
        code: '392604'
        message: Request execution in progress. Use the provided location header or result handler ID to perform query monitoring and management.
        job_id: 01afef9d-0607-0550-0001-dd270c3902d7
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: Error message returned by the server
        code:
          type: string
          description: Error code.
        error_code:
          type: string
          description: Error code, same as `code` above. This property has been deprecated and will be removed in a future release, but is temporarily supported for for short-term backward compatibility.
        request_id:
          type: string
          description: Unique request ID.
      example:
        message: Compilation error!
        error_code: '390189'
        request_id: 01afef9d-0607-0550-0001-dd270c3902d7
    SuccessResponse:
      type: object
      description: Schema for all the success responses returned by the server.
      properties:
        status:
          type: string
          description: Message returned by the server.
      example:
        status: Request successfully completed
    TagReference:
      type: object
      description: Identifier for a tag, including optional database and schema names.
      properties:
        tag_database:
          description: The database in which the tag is defined.
          allOf:
            - $ref: '#/components/schemas/Identifier'
        tag_schema:
          description: The schema in which the tag is defined.
          allOf:
            - $ref: '#/components/schemas/Identifier'
        tag_name:
          description: The name of the tag.
          allOf:
            - $ref: '#/components/schemas/Identifier'
      required:
        - tag_name
    TagAssignment:
      description: Defines an association between a tag and value.
      allOf:
        - $ref: '#/components/schemas/TagReference'
      properties:
        tag_value:
          type: string
          description: The value of the tag.
        level:
          type: string
          readOnly: true
          description: The object domain on which the tag is set.
      required:
        - tag_value
  securitySchemes:
    KeyPair:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Set `X-Snowflake-Authorization-Token-Type` to `KEYPAIR_JWT` if the token is a key-pair authentication JWT.
    ExternalOAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Configure External Oauth with Snowflake (see <a href=https://docs.snowflake.com/en/user-guide/oauth-ext-overview>External OAuth overview</a>.) Set `X-Snowflake-Authorization-Token-Type` to `OAUTH` and set the Token to the auth token received from the external Auth server.
    SnowflakeOAuth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: /oauth/authorize
          scopes: {}
      description: Set `X-Snowflake-Authorization-Token-Type` to `OAUTH` if the token is snowflakeOAuth
    ProgrammaticAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Set `X-Snowflake-Authorization-Token-Type` to `PROGRAMMATIC_ACCESS_TOKEN` if the token is a programmatic access token.
  parameters:
    database:
      name: database
      description: Identifier (i.e. name) for the database to which the resource belongs. You can use the `/api/v2/databases` GET request to get a list of available databases.
      required: true
      in: path
      schema:
        example: TEST_DB
        $ref: '#/components/schemas/Identifier'
    schema:
      name: schema
      description: Identifier (i.e. name) for the schema to which the resource belongs. You can use the `/api/v2/databases/{database}/schemas` GET request to get a list of available schemas for the specified database.
      required: true
      in: path
      schema:
        example: TEST_SCHEMA
        $ref: '#/components/schemas/Identifier'
    rootOnly:
      name: rootOnly
      description: Parameter to filter the command output to return only root resources (resources with no predecessors).
      in: query
      schema:
        type: boolean
        example: false
        default: false
    like:
      name: like
      description: Parameter to filter the command output by resource name. Uses case-insensitive pattern matching, with support for SQL wildcard characters.
      in: query
      schema:
        type: string
        example: test_%
    startsWith:
      name: startsWith
      description: Parameter to filter the command output based on the string of characters that appear at the beginning of the object name. Uses case-sensitive pattern matching.
      in: query
      schema:
        type: string
        example: test
    showLimit:
      name: showLimit
      description: Parameter to limit the maximum number of rows returned by a command.
      in: query
      schema:
        type: integer
        example: 10
        minimum: 1
        maximum: 10000
    fromName:
      name: fromName
      description: Parameter to enable fetching rows only following the first row whose object name matches the specified string. Case-sensitive and does not have to be the full name.
      in: query
      schema:
        type: string
        example: from_test
    createMode:
      name: createMode
      description: 'Parameter allowing support for different modes of resource creation. Possible values include:

        - `errorIfExists`: Throws an error if you try to create a resource that already exists.

        - `orReplace`: Automatically replaces the existing resource with the current one.

        - `ifNotExists`: Creates a new resource when an alter is requested for a non-existent resource.'
      in: query
      schema:
        type: string
        enum:
          - errorIfExists
          - orReplace
          - ifNotExists
        example: ifNotExists
        default: errorIfExists
    name:
      name: name
      description: Identifier (i.e. name) for the resource.
      required: true
      in: path
      schema:
        example: TEST_NAME
        $ref: '#/components/schemas/Identifier'
    ifExists:
      name: ifExists
      description: 'Parameter that specifies how to handle the request for a resource that does not exist:

        - `true`: The endpoint does not throw an error if the resource does not exist. It returns a 200 success response, but does not take any action on the resource.

        - `false`: The endpoint throws an error if the resource doesn''t exist.'
      in: query
      schema:
        type: boolean
        example: true
        default: false
    asyncExec:
      name: asyncExec
      in: query
      description: Asynchronous execution enable/disable. Default is disable.
      schema:
        type: boolean
        default: false
    withLineage:
      name: withLineage
      description: 'Parameter that specifies whether tag assignments inherited by the object from its ancestors in securable object hierarchy should be returned as well:

        - `true`: All tags assigned to this object should be returned, inheritance included.

        - `false`: Only tags explicitly assigned to this object should be returned.'
      in: query
      schema:
        type: boolean
        example: true
        default: false
  headers:
    X-Snowflake-Request-ID:
      description: Unique ID of the API request.
      schema:
        type: string
        format: uuid
    Link:
      description: Links to the page of results (e.g. the first page, the last page, etc.). The header can include multiple 'url' entries with different 'rel' attribute values that specify the page to return ('first', 'next', 'prev', and 'last').
      schema:
        type: string
        example: </api/v2/results/01b66701-0000-001c-0000-0030000b91521?page=0>; rel="first",</api/v2/results/01b66701-0000-001c-0000-0030000b91521?page=1>; rel="next",</api/v2/results/01b66701-0000-001c-0000-0030000b91521?page=9>; rel="last"
  responses:
    202SuccessAcceptedResponse:
      headers:
        Location:
          schema:
            type: string
            description: Relative path for checking request status or getting the result, if available.
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      description: Successfully accepted the request, but it is not completed yet.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessAcceptedResponse'
    400BadRequest:
      description: Bad Request. The request payload is invalid or malformed. This happens if the application didn't send the correct request payload. The response body may include the error code and message indicating the actual cause. The application must reconstruct the request body for retry.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    401Unauthorized:
      description: Unauthorized. The request is not authorized. This happens if the attached access token is invalid or missing. The response body may include the error code and message indicating the actual cause, e.g., expired, invalid token. The application must obtain a new access token for retry.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    403Forbidden:
      description: Forbidden. The request is forbidden. This can also happen if the request is made even if the API is not enabled.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    404NotFound:
      description: Not Found. The request endpoint is not valid. This happens if the API endpoint does not exist, or if the API is not enabled.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    405MethodNotAllowed:
      description: Method Not Allowed. The request method doesn't match the supported API. This happens, for example, if the application calls the API with GET method but the endpoint accepts only POST.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    408RequestTimeout:
      description: Request Timeout. This indicates that the request from the client timed out and was not completed by the server.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    409Conflict:
      description: Conflict. The requested operation could not be performed due to a conflicting state that could not be resolved. This usually happens when a CREATE request was performed when there is a pre-existing resource with the same name, and also without one of the options orReplace/ifNotExists.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    429LimitExceeded:
      description: Limit Exceeded. The number of requests hit the rate limit. The application must slow down the frequency of hitting the API endpoints.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    500InternalServerError:
      description: Internal Server Error. The server hit an unrecoverable system error. The response body may include the error code and message for further guidance. The application owner may need to reach out the customer support.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    503ServiceUnavailable:
      description: Service Unavailable. The request was not processed due to server side timeouts. The application may retry with backoff. The jittered backoff is recommended.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    504GatewayTimeout:
      description: Gateway Timeout. The request was not processed due to server side timeouts. The application may retry with backoff. The jittered backoff is recommended.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    200SuccessResponse:
      description: Successful request.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessResponse'
