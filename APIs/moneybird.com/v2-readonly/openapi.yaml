      operationId: get_administration_id_documents_purchase_invoices
      parameters:
      - $ref: '#/components/parameters/administration_id'
      - name: filter
        in: query
        required: false
        description: 'Filters are `key:value` terms separated by commas (e.g. `period:this_year,state:open`).
          Any filter you pass replaces the defaults below entirely, so include every
          key you need — in particular pass an explicit `period` (a named period or
          a `YYYYMMDD..YYYYMMDD` range) to look beyond the default financial year.
          Available filters:


          | **Filter** | **Type** | **Default** | **Description** |

          | - | - | - | - |

          | period | `String` | `this_year` | A named period (`this_week`, `prev_week`,
          `next_week`, `this_month`, `prev_month`, `next_month`, `this_quarter`, `prev_quarter`,
          `next_quarter`, `this_year`, `prev_year`, `next_year`) or a custom range
          (`201301..201302`, `20130101..20130131`) |

          | state | `String` | `all` | `all`, `new`, `saved`, `open`, `paid`, `late`
          or `pending_payment`. `paid`, `late` and `pending_payment` only apply to
          documents with a payment lifecycle (purchase invoices and receipts) |

          | recurring | `String` | `all` | `all`, `enabled` or `disabled` |

          | attachment | `String` | `all` | `all`, `with` or `without` |

          | reference | `String` | | Documents with the given reference value |

          | contact_id | `Integer` | | Documents belonging to the given contact |

          | ledger_account_id | `Integer` | | Documents booking against the given
          ledger account |

          | updated_after | `String` | | ISO 8601 timestamp in UTC; documents updated
          strictly after this time |


          Multiple values for `state`, `recurring` and `attachment` can be combined
          with a pipe, e.g. `state:open|paid`.'
        schema:
          type: string
          default: period:this_year
      - name: new_filter
        in: query
        required: false
        schema:
          type: string
          description: 'String terms, example: `key1:value1,key2:value2`.'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
