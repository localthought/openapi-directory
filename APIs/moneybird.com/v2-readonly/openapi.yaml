components:
  headers:
    link:
      description: Pagination links (next, prev)
      schema:
        type: string
    x-total-count:
      description: Total number of entries in the collection
      schema:
        type: integer
  requestBodies:
    payment_request:
      required: true
      content:
        application/*:
          schema:
            unevaluatedProperties: false
            type: object
            properties:
              payment:
                type: object
                unevaluatedProperties: false
                properties:
                  payment_date:
                    type: string
                    description: The date on which the payment was made.
                  price:
                    $ref: '#/components/schemas/money'
                    description: The amount paid in the document's currency.
                  price_base:
                    $ref: '#/components/schemas/money'
                    description: Amount paid expressed in the base currency of the
                      administration. Required when the document uses a different
                      currency than the administration's base currency.
                  financial_account_id:
                    $ref: '#/components/schemas/identifier'
                    description: The ID of the financial account (bank account or
                      cash register) associated with this payment. Required for `private_payment`
                      and `cash_payment` actions. Should be a valid financial account
                      id.
                  financial_mutation_id:
                    $ref: '#/components/schemas/identifier'
                    description: The ID of the bank transaction to link this payment
                      to. Required for `bank_transfer` actions. Should be a valid
                      financial mutation id.
                  transaction_identifier:
                    type: string
                    description: An external transaction reference, e.g. a bank transaction
                      ID or PSP reference. Used to match the payment with financial
                      mutations.
                  manual_payment_action:
                    type: string
                    description: Can be `private_payment` (needs financial_account_id),
                      `payment_without_proof`, `cash_payment` (needs financial_account_id),
                      `rounding_error`, `bank_transfer` (needs financial_mutation_id),
                      `balance_settlement` (needs ledger_account_id) or `invoices_settlement`
                      (needs invoice_id).
                  ledger_account_id:
                    $ref: '#/components/schemas/identifier'
                    description: The ID of the ledger account to book this payment
                      to. Required for `balance_settlement` actions. Should be a valid
                      ledger account id.
                  invoice_id:
                    $ref: '#/components/schemas/identifier'
                    description: The ID of the document to settle this payment against.
                      Required for `invoices_settlement` actions. Should be a valid
                      document id (sales invoice, purchase invoice, receipt, etc.).
                required:
                - payment_date
                - price
            required: []
  responses:
    200_synchronization_response:
      description: IDs and versions of records
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              unevaluatedProperties: false
              properties:
                id:
                  anyOf:
                  - type: integer
                  - type: string
                version:
                  anyOf:
                  - type: integer
                  - type: string
    204_no_content:
      description: No content
    302_found:
      description: Found
      content:
        text/plain:
          schema:
            type: string
    400_bad_request:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/symbolic_error'
    401_unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/symbolic_error'
    402_payment_required:
      description: Payment required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/symbolic_error'
    403_forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/symbolic_error'
    404_not_found:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/symbolic_error'
    422_unprocessable_entity:
      description: Unprocessable entity
      content:
        application/json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/symbolic_error'
            - $ref: '#/components/schemas/non_symbolic_error'
    429_too_many_requests:
      description: Too many requests - rate limit exceeded
      content:
        application/json:
          schema:
            type: string
            example: Retry later
      headers:
        RateLimit-Limit:
          description: The rate limit ceiling for that given request
          schema:
            type: integer
            example: 150
        RateLimit-Remaining:
          description: The number of requests left for the time window
          schema:
            type: integer
            example: 149
        RateLimit-Reset:
          description: The time at which the current rate limit window resets in UTC
            epoch seconds
          schema:
            type: integer
            example: 1609459200
        Retry-After:
          description: The time at which the current rate limit window resets in UTC
            epoch seconds
          schema:
            type: integer
            example: 1609459200
    4XX_open_error:
      description: Error code
      content:
        application/json:
          schema:
            type: integer
    status_code:
      description: Status code
      content:
        application/json:
          schema:
            type: integer
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    moneybirdOAuth:
      type: oauth2
      description: OAuth 2.0 authorization for Moneybird administrations. Register
        an external application before using this flow. Contacts require one of the
        sales_invoices, documents, estimates, bank, or settings scopes.
      flows:
        authorizationCode:
          authorizationUrl: https://moneybird.com/oauth/authorize
          tokenUrl: https://moneybird.com/oauth/token
          scopes:
            sales_invoices: Access sales invoices and contacts
            documents: Access documents and contacts
            estimates: Access estimates and contacts
            bank: Access banking data and contacts
            time_entries: Access time entries
            settings: Access settings and contacts
  schemas:
    administration_id:
      allOf:
      - $ref: '#/components/schemas/identifier'
        description: A unique record identifier of an administration
        example: '123'
    administration_response:
      type: object
      unevaluatedProperties: false
      properties:
        id:
          $ref: '#/components/schemas/administration_id'
        name:
          type: string
          example: Moneybird
        language:
          type: string
          enum:
          - nl
          - nl-be
          - en
          example: nl
          description: The ISO 639-1 language code used in the administration
        currency:
          type: string
          description: The ISO 4217 currency code
          example: EUR
        country:
          type: string
          description: The ISO 3166-1 alpha-2 code the administration country
          example: NL
        time_zone:
          type: string
          description: The time zone of the administration
          example: Europe/Amsterdam
        access:
          type: string
          enum:
          - accountant_company
          - user
          description: The type of acess the user has to this administration
          example: user
        suspended:
          type: boolean
        period_locked_until:
          type: string
          format: date
          nullable: true
        period_start_date:
          type: string
          format: date
          description: Start of the year in which the administration recorded its
            first bookkeeping data, based on journal entries.
          example: '2024-01-01'
    aging_report_item:
      type: object
      description: Aging report data item
      properties:
        contact_id:
          $ref: '#/components/schemas/identifier_nullable'
        amount:
          type: string
        aging_buckets:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: The aging bucket name, e.g. '< 30 days', '30-60 days',
                  '60+ days'
              amount:
                type: string
    asset_response:
      type: object
      unevaluatedProperties: false
      properties:
        id:
          $ref: '#/components/schemas/identifier_nullable'
        ledger_account_id:
          $ref: '#/components/schemas/identifier_nullable'
        name:
          type: string
        purchase_date:
          type: string
          format: date
        purchase_value:
          $ref: '#/components/schemas/number'
        calculated_purchase_value:
