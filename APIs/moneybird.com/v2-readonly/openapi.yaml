  /{administration_id}/contacts/{contact_id}/additional_charges.json:
    get:
      summary: Get additional charges
      description: "Get the additional charges of the given contact.\n\n### Required\
        \ scope(s)\n `sales_invoices`"
      tags:
      - Contacts
      security:
      - bearerAuth:
        - sales_invoices
      responses:
        '200':
          description: A list of additional charges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/subscription_additional_charge_response'
              examples:
                DoesReturnBilledAdditionalChargesIfIncludeBilledIsTrue:
                  summary: Does return billed additional charges if include billed
                    is true
                  value:
                  - id: '497800875730797913'
                    administration_id: 123
                    contact_id: '497800875699340620'
                    subscription_id: null
                    product_id: '497800875728700760'
                    detail_id: null
                    amount: 1 x
                    price: '100.0'
                    period: 202106..202106
                    description: Transaction Costs
                  - id: '497800875762255201'
                    administration_id: 123
                    contact_id: '497800875699340620'
                    subscription_id: null
                    product_id: '497800875733943642'
                    detail_id: '497800875759109472'
                    amount: 1 x
                    price: '100.0'
                    period: 202106..202106
                    description: Transaction Costs
        '404':
          $ref: '#/components/responses/404_not_found'
      operationId: get_administration_id_contacts_id_additional_charges
      parameters:
      - $ref: '#/components/parameters/administration_id'
      - name: contact_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/identifier'
      - name: include_billed
        in: query
        required: false
        schema:
          description: If true, includes the additional charges that have already
            been billed. Default is false.
          anyOf:
          - type: boolean
          - type: string
        examples:
          DoesReturnBilledAdditionalChargesIfIncludeBilledIsTrue:
            summary: Does return billed additional charges if include billed is true
            value: 'true'
