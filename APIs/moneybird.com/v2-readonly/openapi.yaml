  /{administration_id}/contacts.json:
    get:
      summary: List all contacts
      description: "Returns a paginated list of contacts in the administration.\n\n\
        Searching for contacts can be done by providing the `query` parameter with\
        \ search terms. The API searches for matches in the following contact fields:\n\
        \n- `company_name`\n- `attention`\n- `firstname`\n- `lastname`\n- `address1`\n\
        - `address2`\n- `zipcode`\n- `city`\n- `country`\n- `email`\n- `phone`\n-\
        \ `customer_id`\n- `tax_number`\n- `chamber_of_commerce`\n- `bank_account`\n\
        \n### Required scope(s)\n Any of: `estimates`, `sales_invoices`, `documents`,\
        \ `bank` or `settings`"
