          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/symbolic_error'
              examples:
                ReturnsAnErrorWhenTooManyEstimatesAreRequested:
                  summary: Returns an error when too many estimates are requested
                  value:
                    error: per_page does not have a valid value
      operationId: get_administration_id_estimates
      parameters:
      - $ref: '#/components/parameters/administration_id'
      - name: filter
        in: query
        required: false
        description: 'Filters are `key:value` terms separated by commas (e.g. `period:this_year,state:all`).
          Any filter you pass replaces the defaults below entirely, so include every
          key you need — in particular pass an explicit `period` (a named period or
          a `YYYYMMDD..YYYYMMDD` range) to look beyond the default financial year.
          Available filters:


          | **Filter** | **Type** | **Default** | **Description** |

          | --- | --- | --- | --- |

          | state | `String` | `all` | `all`, `draft`, `open`, `late`, `accepted`,
          `rejected`, `billed` or `archived` |

          | period | `String` | `this_year` | This can either be the description of
          a period (`this_week`, `prev_week`, `next_week`, `this_month`, `prev_month`,
          `next_month`, `this_quarter`, `prev_quarter`, `next_quarter`, `this_year`,
          `prev_year`, `next_year`) or a custom period (`201301..201302`, `20130101..20130131`)
          |

          | contact_id | `Integer` | | Filters estimates by a single contact |

          | workflow_id | `Integer` | | Filters estimates by a single workflow |


          You can filter by multiple states at the same time as well. To do this,
          separate the state values by a pipe: `state:draft|scheduled`.'
        schema:
          type: string
          default: period:this_year
        examples:
          ReturnsAllEstimatesFilteredOnState:
            summary: Returns all estimates filtered on state
            value: state:open
          ReturnsAllEstimatesFilteredOnPeriod:
            summary: Returns all estimates filtered on period
            value: period:this_month
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
