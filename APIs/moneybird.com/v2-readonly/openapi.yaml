          ReturnsOnlyTaxRatesUpdatedAfterGivenDatetime:
            summary: Returns only tax rates updated after given datetime
            value: updated_after:2026-09-09 13:19:48 UTC
          ReturnsAllTaxRatesCreatedAfterGivenDatetime:
            summary: Returns all tax rates created after given datetime
            value: created_after:2026-09-08 13:19:43 UTC
