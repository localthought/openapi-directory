        \ the administration. The `source`\nfield can be `sales_invoices`, `contact`\
        \ or `identity` and defines for which entities the custom\nfield can be used.\
        \ The id of a custom field is required to add a value for a custom field to\
        \ an\nentity.\n\n### Required scope(s)\n Any of: `settings`, `sales_invoices`,\
        \ `documents`, `estimates` or `bank`"
