              description: The ID of the project to associate with this detail. Should
                be a valid project id. Used to track revenue and expenses per project.
            product_id:
              $ref: '#/components/schemas/identifier'
              description: The ID of the product to use for this detail. When provided,
                the product's default price, tax rate, ledger account, description
                and period are applied as defaults. Explicitly provided values take
                precedence. Should be a valid product id.
            row_order:
              description: The position of this detail in the document, starting at
                0. Used to control the display order of details.
              anyOf:
