tags:
  - name: OperationService
paths:
  /operation/2020-05-05/organizations/{location.organization_id}/projects/{location.project_id}/operations:
    get:
      summary: 'List selects a list of operations that match some filters and then returns

        them in the response.'
      description: 'The supported filters are the Location''s organization_id and project_id.

        The project_id supports the special value "-" to allow requesting operations

        that match any project within the organization.'
      operationId: List
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hashicorp.cloud.operation.ListResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
        - name: location.organization_id
          description: organization_id is the id of the organization.
          in: path
          required: true
          schema:
            type: string
        - name: location.project_id
          description: project_id is the projects id.
          in: path
          required: true
          schema:
            type: string
        - name: location.region.provider
          description: provider is the named cloud provider ("aws", "gcp", "azure")
          in: query
          required: false
          schema:
            type: string
        - name: location.region.region
          description: region is the cloud region ("us-west1", "us-east1")
          in: query
          required: false
          schema:
            type: string
        - name: pagination.page_size
          description: 'The max number of results per page that should be returned. If the number

            of available results is larger than `page_size`, a `next_page_token` is

            returned which can be used to get the next page of results in subsequent

            requests. A value of zero will cause `page_size` to be defaulted.'
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: pagination.next_page_token
          description: 'Specifies a page token to use to retrieve the next page. Set this to the

            `next_page_token` returned by previous list requests to get the next page of

            results. If set, `previous_page_token` must not be set.'
          in: query
          required: false
          schema:
            type: string
        - name: pagination.previous_page_token
          description: 'Specifies a page token to use to retrieve the previous page. Set this to

            the `previous_page_token` returned by previous list requests to get the

            previous page of results. If set, `next_page_token` must not be set.'
          in: query
          required: false
          schema:
            type: string
        - name: linked_resource.type
          description: 'type is the unique type of the resource. Each service publishes a

            unique set of types. The type value is recommended to be formatted

            in "<org>.<type>" such as "hashicorp.hvn". This is to prevent conflicts

            in the future, but any string value will work.'
          in: query
          required: false
          schema:
            type: string
        - name: linked_resource.id
          description: id is the identifier for this resource.
          in: query
          required: false
          schema:
            type: string
        - name: linked_resource.uuid
          description: uuid is the unique UUID for this resource.
          in: query
          required: false
          schema:
            type: string
        - name: linked_resource.location.region.provider
          description: provider is the named cloud provider ("aws", "gcp", "azure")
          in: query
          required: false
          schema:
            type: string
        - name: linked_resource.location.region.region
          description: region is the cloud region ("us-west1", "us-east1")
          in: query
          required: false
          schema:
            type: string
        - name: linked_resource.description
          description: 'description is a human-friendly description for this link. This is

            used primarily for informational purposes such as error messages.'
          in: query
          required: false
          schema:
            type: string
      tags:
        - OperationService
  /operation/2020-05-05/organizations/{location.organization_id}/projects/{location.project_id}/operations/{id}:
    get:
      summary: Get returns the latest state of a specific operation.
      description: 'The Location''s organization and project IDs are included in the path in

        order to support RBAC checks. We perform RBAC checks early in the request

        lifecycle, before loading the resource targeted by the request.'
      operationId: Get
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hashicorp.cloud.operation.GetResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
        - name: location.organization_id
          description: organization_id is the id of the organization.
          in: path
          required: true
          schema:
            type: string
        - name: location.project_id
          description: project_id is the projects id.
          in: path
          required: true
          schema:
            type: string
        - name: id
          description: id is the UUID of the operation.
          in: path
          required: true
          schema:
            type: string
        - name: location.region.provider
          description: provider is the named cloud provider ("aws", "gcp", "azure")
          in: query
          required: false
          schema:
            type: string
        - name: location.region.region
          description: region is the cloud region ("us-west1", "us-east1")
          in: query
          required: false
          schema:
            type: string
      tags:
        - OperationService
  /operation/2020-05-05/organizations/{location.organization_id}/projects/{location.project_id}/operations/{id}/wait:
    get:
      summary: 'Wait blocks until an operation is DONE or a timeout is reached,

        whichever occurs first. It then returns the latest state of the operation

        that it had at the time of the timeout.'
      description: 'Note that Wait may return at any time. In most cases, the timeout will

        be respected but it isn''t guaranteed. Therefore, clients should always

        check the state of the returned operation. A return from Wait does not

        guarantee the operation is DONE.


        The Location''s organization and project IDs are included in the path in

        order to support RBAC checks. We perform RBAC checks early in the request

        lifecycle, before loading the resource targeted by the request.'
      operationId: Wait
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hashicorp.cloud.operation.WaitResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
        - name: location.organization_id
          description: organization_id is the id of the organization.
          in: path
          required: true
          schema:
            type: string
        - name: location.project_id
          description: project_id is the projects id.
          in: path
          required: true
          schema:
            type: string
        - name: id
          description: id is the UUID of the operation.
          in: path
          required: true
          schema:
            type: string
        - name: timeout
          description: 'timeout is the duration to wait until timing out and returning.

            The shortest timeout is always used, so if the HTTP/RPC call has a

            shorter timeout then that will be used instead. When the timeout is

            reached, Wait will return with the operation no matter what state it is

            in.'
          in: query
          required: false
          schema:
            type: string
        - name: location.region.provider
          description: provider is the named cloud provider ("aws", "gcp", "azure")
          in: query
          required: false
          schema:
            type: string
        - name: location.region.region
          description: region is the cloud region ("us-west1", "us-east1")
          in: query
          required: false
          schema:
            type: string
      tags:
        - OperationService
security:
  - bearer: []
servers:
  - url: //api.cloud.hashicorp.com
components:
  securitySchemes:
    bearer:
      type: apiKey
      description: 'Authentication token, prefixed by Bearer: Bearer <token>'
      name: Authorization
      in: header
  schemas:
    google.protobuf.Any:
      type: object
      properties:
        '@type':
          type: string
          description: "A URL/resource name that uniquely identifies the type of the serialized\nprotocol buffer message. This string must contain at least\none \"/\" character. The last segment of the URL's path must represent\nthe fully qualified name of the type (as in\n`path/google.protobuf.Duration`). The name should be in a canonical form\n(e.g., leading \".\" is not accepted).\n\nIn practice, teams usually precompile into the binary all types that they\nexpect it to use in the context of Any. However, for URLs which use the\nscheme `http`, `https`, or no scheme, one can optionally set up a type\nserver that maps type URLs to message definitions as follows:\n\n* If no scheme is provided, `https` is assumed.\n* An HTTP GET on the URL must yield a [google.protobuf.Type][]\n  value in binary format, or produce an error.\n* Applications are allowed to cache lookup results based on the\n  URL, or have them precompiled into a binary to avoid any\n  lookup. Therefore, binary compatibility needs to be preserved\n  on changes to types. (Use versioned type names to manage\n  breaking changes.)\n\nNote: this functionality is not currently available in the official\nprotobuf release, and it is not used for type URLs beginning with\ntype.googleapis.com. As of May 2023, there are no widely used type server\nimplementations and no plans to implement one.\n\nSchemes other than `http`, `https` (or the empty scheme) might be\nused with implementation specific semantics."
      additionalProperties: {}
      description: "`Any` contains an arbitrary serialized protocol buffer message along with a\nURL that describes the type of the serialized message.\n\nProtobuf library provides support to pack/unpack Any values in the form\nof utility functions or additional generated methods of the Any type.\n\nExample 1: Pack and unpack a message in C++.\n\n    Foo foo = ...;\n    Any any;\n    any.PackFrom(foo);\n    ...\n    if (any.UnpackTo(&foo)) {\n      ...\n    }\n\nExample 2: Pack and unpack a message in Java.\n\n    Foo foo = ...;\n    Any any = Any.pack(foo);\n    ...\n    if (any.is(Foo.class)) {\n      foo = any.unpack(Foo.class);\n    }\n    // or ...\n    if (any.isSameTypeAs(Foo.getDefaultInstance())) {\n      foo = any.unpack(Foo.getDefaultInstance());\n    }\n\n Example 3: Pack and unpack a message in Python.\n\n    foo = Foo(...)\n    any = Any()\n    any.Pack(foo)\n    ...\n    if any.Is(Foo.DESCRIPTOR):\n      any.Unpack(foo)\n      ...\n\n Example 4: Pack and unpack a message in Go\n\n     foo := &pb.Foo{...}\n     any, err := anypb.New(foo)\n     if err != nil {\n       ...\n     }\n     ...\n     foo := &pb.Foo{}\n     if err := any.UnmarshalTo(foo); err != nil {\n       ...\n     }\n\nThe pack methods provided by protobuf library will by default use\n'type.googleapis.com/full.type.name' as the type URL and the unpack\nmethods only use the fully qualified type name after the last '/'\nin the type URL, for example \"foo.bar.com/x/y.z\" will yield type\nname \"y.z\".\n\nJSON\n====\nThe JSON representation of an `Any` value uses the regular\nrepresentation of the deserialized, embedded message, with an\nadditional field `@type` which contains the type URL. Example:\n\n    package google.profile;\n    message Person {\n      string first_name = 1;\n      string last_name = 2;\n    }\n\n    {\n      \"@type\": \"type.googleapis.com/google.profile.Person\",\n      \"firstName\": <string>,\n      \"lastName\": <string>\n    }\n\nIf the embedded message type is well-known and has a custom JSON\nrepresentation, that representation will be embedded adding a field\n`value` which holds the custom JSON in addition to the `@type`\nfield. Example (for message [google.protobuf.Duration][]):\n\n    {\n      \"@type\": \"type.googleapis.com/google.protobuf.Duration\",\n      \"value\": \"1.212s\"\n    }"
    google.rpc.Status:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: 'A developer-facing error message, which should be in English. Any

            user-facing error message should be localized and sent in the

            [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.'
        details:
          type: array
          items:
            $ref: '#/components/schemas/google.protobuf.Any'
          description: 'A list of messages that carry the error details.  There is a common set of

            message types for APIs to use.'
      description: 'The `Status` type defines a logical error model that is suitable for

        different programming environments, including REST APIs and RPC APIs. It is

        used by [gRPC](https://github.com/grpc). Each `Status` message contains

        three pieces of data: error code, error message, and error details.


        You can find out more about this error model and how to work with it in the

        [API Design Guide](https://cloud.google.com/apis/design/errors).'
    hashicorp.cloud.common.PaginationRequest:
      type: object
      properties:
        page_size:
          type: integer
          format: int64
          description: 'The max number of results per page that should be returned. If the number

            of available results is larger than `page_size`, a `next_page_token` is

            returned which can be used to get the next page of results in subsequent

            requests. A value of zero will cause `page_size` to be defaulted.'
        next_page_token:
          type: string
          description: 'Specifies a page token to use to retrieve the next page. Set this to the

            `next_page_token` returned by previous list requests to get the next page of

            results. If set, `previous_page_token` must not be set.'
        previous_page_token:
          type: string
          description: 'Specifies a page token to use to retrieve the previous page. Set this to

            the `previous_page_token` returned by previous list requests to get the

            previous page of results. If set, `next_page_token` must not be set.'
      description: PaginationRequest are the parameters for a paginated list request.
    hashicorp.cloud.common.PaginationResponse:
      type: object
      properties:
        next_page_token:
          type: string
          description: 'This token allows you to get the next page of results for list requests.

            If the number of results is larger than `page_size`, use the

            `next_page_token` as a value for the query parameter `next_page_token` in

            the next request. The value will become empty when there are no more pages.'
        previous_page_token:
          type: string
          description: 'This token allows you to get the previous page of results for list

            requests. If the number of results is larger than `page_size`, use the

            `previous_page_token` as a value for the query parameter

            `previous_page_token` in the next request. The value will become empty when

            there are no more pages.'
      description: 'PaginationResponse is the response holding the page tokens for a paginated

        list response.'
    hashicorp.cloud.location.Link:
      type: object
      properties:
        type:
          type: string
          description: 'type is the unique type of the resource. Each service publishes a

            unique set of types. The type value is recommended to be formatted

            in "<org>.<type>" such as "hashicorp.hvn". This is to prevent conflicts

            in the future, but any string value will work.'
        id:
          type: string
          description: id is the identifier for this resource.
        uuid:
          type: string
          description: uuid is the unique UUID for this resource.
        location:
          allOf:
            - $ref: '#/components/schemas/hashicorp.cloud.location.Location'
            - description: location is the location where this resource is.
        description:
          type: string
          description: 'description is a human-friendly description for this link. This is

            used primarily for informational purposes such as error messages.'
      description: 'Link is used to uniquely reference any resource within HashiCorp Cloud.

        This can be conceptually considered a "foreign key".'
    hashicorp.cloud.location.Location:
      type: object
      properties:
        organization_id:
          type: string
          description: organization_id is the id of the organization.
        project_id:
          type: string
          description: project_id is the projects id.
        region:
          allOf:
            - $ref: '#/components/schemas/hashicorp.cloud.location.Region'
            - description: 'region is the region that the resource is located in. It is

                optional if the object being referenced is a global object.'
      description: Location represents a target for an operation in HCP.
    hashicorp.cloud.location.Region:
      type: object
      properties:
        provider:
          type: string
          title: provider is the named cloud provider ("aws", "gcp", "azure")
        region:
          type: string
          title: region is the cloud region ("us-west1", "us-east1")
      description: Region identifies a Cloud data-plane region.
    hashicorp.cloud.operation.GetResponse:
      type: object
      properties:
        operation:
          allOf:
            - $ref: '#/components/schemas/hashicorp.cloud.operation.Operation'
            - description: operation is the requested operation.
      title: See OperationService.Get
    hashicorp.cloud.operation.ListResponse:
      type: object
      properties:
        operations:
          type: array
          items:
            $ref: '#/components/schemas/hashicorp.cloud.operation.Operation'
          description: 'operations is a list of Operation messages that matched the filters

            in the request. They''re akin to search results.'
        pagination:
          allOf:
            - $ref: '#/components/schemas/hashicorp.cloud.common.PaginationResponse'
            - description: pagination contains the pagination tokens for a subsequent request.
      description: ListResponse contains a list of operations.
    hashicorp.cloud.operation.Operation:
      type: object
      properties:
        id:
          type: string
          description: 'id is the unique ID for this operation used in other RPC calls.

            This ID is only guaranteed to be unique within the region that

            the operation is running in.'
        state:
          allOf:
            - $ref: '#/components/schemas/hashicorp.cloud.operation.Operation.State'
            - description: 'state is the current state of the operation. This is a simple tri-state:

                PENDING means the operation is created but not yet started, RUNNING means

                the operation is currently running (though it may be very long-running),

                and DONE means the operation is complete whether successfully or not.'
        error:
          allOf:
            - $ref: '#/components/schemas/google.rpc.Status'
            - description: error is the error that occurred in the operation.
        response:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Any'
            - description: 'response is the result of the operation. See the documentation for the API

                call creating the operation to understand what the value of this is.'
        location:
          allOf:
            - $ref: '#/components/schemas/hashicorp.cloud.location.Location'
            - description: Location is location of the resource that this operation belongs to.
        link:
          allOf:
            - $ref: '#/components/schemas/hashicorp.cloud.location.Link'
            - description: Link is the resource link the operation is associated with.
        created_at:
          type: string
          format: date-time
          description: CreatedAt is the timestamp of when the operation was first created.
        updated_at:
          type: string
          format: date-time
          description: UpdatedAt is the timestamp of when the operation was last updated.
      description: Operation represents a single operation.
    hashicorp.cloud.operation.Operation.State:
      type: string
      enum:
        - PENDING
        - RUNNING
        - DONE
        - QUEUED
      default: PENDING
      description: 'State is one of the states that an Operation can be in.


        The states are purposely coarse grained to make it easy to understand

        the operation state machine: pending => running => done. Or pending =>

        queued => running => done. No other state transitions are possible.

        Success/failure can be determined based on the result oneof.'
    hashicorp.cloud.operation.WaitResponse:
      type: object
      properties:
        operation:
          allOf:
            - $ref: '#/components/schemas/hashicorp.cloud.operation.Operation'
            - description: operation is the latest state of the requested operation.
      title: See OperationService.Wait
