          type: string
          description: The updated name for the webhook.
    hashicorp.cloud.webhook.UpdateWebhookNameResponse:
      type: object
      properties:
        webhook:
          allOf:
            - $ref: '#/components/schemas/hashicorp.cloud.webhook.Webhook'
            - description: The updated webhook.
    hashicorp.cloud.webhook.UpdateWebhookRequestBody:
      type: object
      properties:
        webhook:
          allOf:
            - $ref: '#/components/schemas/hashicorp.cloud.webhook.Webhook'
            - description: The webhook to update.
        update_mask:
          type: string
          description: 'The required mask of webhook fields to update. The endpoint converts field names to the lower-camel naming convention.

            Fields that you can update are `description`, `config`, `subscriptions`, and `enabled`.


            Example of usage:

            * `"description,config"` updates the description, `config.url`, and `config.hmac_key`.

            * `"config.hmacKey"` only updates `config.hmac_key`.

