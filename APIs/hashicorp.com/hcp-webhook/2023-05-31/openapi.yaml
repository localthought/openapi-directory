          type: array
          items:
            $ref: '#/components/schemas/hashicorp.cloud.webhook.WebhookSubscriptionEvent'
          description: 'The list of resource lifecycle events that the webhook is subscribed to.

            Events are a combination of event source and event action.

            For example, `hashicorp.packer.version:create`.

            The wildcard(`*`) subscribes the webhook to all the source''s events, for example `hashicorp.packer.version:*`.'
      description: 'The information about a webhook subscription.

        A webhook can either provide the `resource_id` to subscribe to events generated by a specific resource,

        or they can subscribe to the available events for all resources in the webhook''s project when the `resource_id` is omitted.'
    hashicorp.cloud.webhook.WebhookSubscriptionEvent:
      type: object
      properties:
        action:
          type: string
          description: 'The type of action of this event, such as `create`, `update`, or `delete`.

            When the action is ''*'', it means that the webhook is subscribed to all event actions for the event source.'
        source:
          type: string
          description: The source of the event, such as `hashicorp.packer.version`.
      description: The information about an event type of a webhook subscription.
