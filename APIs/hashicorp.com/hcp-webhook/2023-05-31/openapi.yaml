      description: SortingRequest are the parameters for a sorted list request.
    hashicorp.cloud.webhook.CreateWebhookRequestBody:
      type: object
      properties:
        name:
          type: string
          description: The webhook name.
        description:
          type: string
          description: The webhook description. Useful for providing a summary of the webhook.
        config:
          allOf:
            - $ref: '#/components/schemas/hashicorp.cloud.webhook.WebhookConfig'
            - description: The required information for delivering event payloads.
        subscriptions:
          type: array
          items:
            $ref: '#/components/schemas/hashicorp.cloud.webhook.WebhookSubscription'
          description: The resource lifecycle events that this webhook is subscribed to.
        test_payload:
          allOf:
            - $ref: '#/components/schemas/hashicorp.cloud.webhook.WebhookPayload'
            - description: 'The optional payload used to deliver a test request to validate the webhook configuration.

                If not set, the webhook service delivers a generic payload.'
        enabled:
          type: boolean
          description: 'When set to ''true'', a verification request will be sent and the webhook created enabled and only if the verification succeeds.

            When set to ''false'', the webhook configuration won''t be verified and the webhook created disabled.

            When left unset, a verification request will be sent and the webhook will be created enabled if it succeeds,

            or disabled if it fails.'
          nullable: true
    hashicorp.cloud.webhook.CreateWebhookResponse:
      type: object
