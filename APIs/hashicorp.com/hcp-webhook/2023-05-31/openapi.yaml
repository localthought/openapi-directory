tags:
  - name: WebhookService
paths:
  /2023-05-31/webhook/{parent_resource_name}/webhooks:
    get:
      summary: Lists all existing webhooks in an HCP project.
      operationId: WebhookService_ListWebhooks
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hashicorp.cloud.webhook.ListWebhooksResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
        - name: parent_resource_name
          description: The parent resource of a webhook is an HCP project. A project's resource name format is `project/<project-id>`.
          in: path
          required: true
          schema:
            type: string
            pattern: project/[^/]+
        - name: pagination.page_size
          description: 'The max number of results per page that should be returned. If the number

            of available results is larger than `page_size`, a `next_page_token` is

            returned which can be used to get the next page of results in subsequent

            requests. A value of zero will cause `page_size` to be defaulted.'
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: pagination.next_page_token
          description: 'Specifies a page token to use to retrieve the next page. Set this to the

            `next_page_token` returned by previous list requests to get the next page of

            results. If set, `previous_page_token` must not be set.'
          in: query
          required: false
          schema:
            type: string
        - name: pagination.previous_page_token
          description: 'Specifies a page token to use to retrieve the previous page. Set this to

            the `previous_page_token` returned by previous list requests to get the

            previous page of results. If set, `next_page_token` must not be set.'
          in: query
          required: false
          schema:
            type: string
        - name: sorting.order_by
          description: "Specifies the list of per field ordering that should be used for sorting. \nThe order matters as rows are sorted in order by fields and when the field\nmatches, the next field is used to tie break the ordering.\nThe per field default ordering is ascending.  \n\nThe fields should be immutabile, unique, and orderable. If the field is\nnot unique, more than one sort fields should be passed.\n\nExample: oder_by=name,age desc,created_at asc\nIn that case, 'name' will get the default 'ascending' order."
          in: query
          required: false
          explode: true
          schema:
            type: array
            items:
              type: string
      tags:
        - WebhookService
    post:
      summary: Creates an enabled webhook that is optionally subscribed to the resources' lifecycle events.
      operationId: WebhookService_CreateWebhook
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hashicorp.cloud.webhook.CreateWebhookResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
        - name: parent_resource_name
          description: The parent resource of a webhook is an HCP project. A project's resource name format is `project/<project-id>`.
          in: path
          required: true
          schema:
            type: string
            pattern: project/[^/]+
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hashicorp.cloud.webhook.CreateWebhookRequestBody'
        description: The information to create a webhook.
        required: true
      tags:
        - WebhookService
  /2023-05-31/{parent_resource_name}/deliveries:
    get:
      summary: Lists all the deliveries from the last 90 days for a webhook.
      operationId: WebhookService_ListWebhookDeliveries
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hashicorp.cloud.webhook.ListWebhookDeliveriesResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
        - name: parent_resource_name
          description: 'The parent resource of webhook deliveries is a webhook.

            A webhook''s resource name format name is `webhook/project/<project-id>/geo/<geography>/webhook/<webhook-name>`.'
          in: path
          required: true
          schema:
            type: string
            pattern: webhook/project/[^/]+/geo/[^/]+/webhook/[^/]+
        - name: pagination.page_size
          description: 'The max number of results per page that should be returned. If the number

            of available results is larger than `page_size`, a `next_page_token` is

            returned which can be used to get the next page of results in subsequent

            requests. A value of zero will cause `page_size` to be defaulted.'
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: pagination.next_page_token
          description: 'Specifies a page token to use to retrieve the next page. Set this to the

            `next_page_token` returned by previous list requests to get the next page of

            results. If set, `previous_page_token` must not be set.'
          in: query
          required: false
          schema:
            type: string
        - name: pagination.previous_page_token
          description: 'Specifies a page token to use to retrieve the previous page. Set this to

            the `previous_page_token` returned by previous list requests to get the

            previous page of results. If set, `next_page_token` must not be set.'
          in: query
          required: false
          schema:
            type: string
        - name: sorting.order_by
          description: "Specifies the list of per field ordering that should be used for sorting. \nThe order matters as rows are sorted in order by fields and when the field\nmatches, the next field is used to tie break the ordering.\nThe per field default ordering is ascending.  \n\nThe fields should be immutabile, unique, and orderable. If the field is\nnot unique, more than one sort fields should be passed.\n\nExample: oder_by=name,age desc,created_at asc\nIn that case, 'name' will get the default 'ascending' order."
          in: query
          required: false
          explode: true
          schema:
            type: array
            items:
              type: string
      tags:
        - WebhookService
  /2023-05-31/{resource_name}:
    get:
      summary: Gets an existing webhook.
      operationId: WebhookService_GetWebhook
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hashicorp.cloud.webhook.GetWebhookResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
        - name: resource_name
          description: 'The webhook resource name.

            A webhook''s resource name format name is `webhook/project/<project-id>/geo/<geography>/webhook/<webhook-name>`.'
          in: path
          required: true
          schema:
            type: string
            pattern: webhook/project/[^/]+/geo/[^/]+/webhook/[^/]+
      tags:
        - WebhookService
    delete:
      summary: Deletes a webhook and all of its delivery records.
      operationId: WebhookService_DeleteWebhook
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hashicorp.cloud.webhook.DeleteWebhookResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
        - name: resource_name
          description: 'The webhook resource name.

            A webhook''s resource name format name is `webhook/project/<project-id>/geo/<geography>/webhook/<webhook-name>`.'
          in: path
          required: true
          schema:
            type: string
            pattern: webhook/project/[^/]+/geo/[^/]+/webhook/[^/]+
      tags:
        - WebhookService
    patch:
      summary: Updates a webhook configuration and subscriptions and sets the status to `enabled` or `disabled`.
      operationId: WebhookService_UpdateWebhook
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hashicorp.cloud.webhook.UpdateWebhookResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
        - name: resource_name
          description: 'The webhook resource name.

            A webhook''s resource name format name is `webhook/project/<project-id>/geo/<geography>/webhook/<webhook-name>`.'
          in: path
          required: true
          schema:
            type: string
            pattern: webhook/project/[^/]+/geo/[^/]+/webhook/[^/]+
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hashicorp.cloud.webhook.UpdateWebhookRequestBody'
        description: The information to update a webhook.
        required: true
      tags:
        - WebhookService
  /2023-05-31/{resource_name}/name:
    patch:
      summary: Updates a webhook name. Updating a webhook name changes its resource name.
      operationId: WebhookService_UpdateWebhookName
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hashicorp.cloud.webhook.UpdateWebhookNameResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
        - name: resource_name
          description: 'The webhook resource name.

            A webhook''s resource name format name is `webhook/project/<project-id>/geo/<geography>/webhook/<webhook-name>`.'
          in: path
          required: true
          schema:
            type: string
            pattern: webhook/project/[^/]+/geo/[^/]+/webhook/[^/]+
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hashicorp.cloud.webhook.UpdateWebhookNameRequestBody'
        description: The information to update a webhook name.
        required: true
      tags:
        - WebhookService
