            For example, webhooks subscribed to `hashicorp.packer.registry` receive events for the descendant''s resources,

            such as a `hashicorp.packer.version`.'
        event_version:
          type: string
          description: The version of the payload being sent.
        event_payload:
          type: object
          description: The payload containing information about the resource's lifecycle event. The lifecycle event is defined by the services that own the resources.
      description: The payload that is delivered as the body of the request made to the webhook's destination URL.
    hashicorp.cloud.webhook.WebhookRequest:
      type: object
      properties:
        headers:
          type: object
          additionalProperties:
            type: string
          description: The request headers.
        url:
          type: string
          description: The request's destination URL.
        payload:
