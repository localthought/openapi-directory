    hashicorp.cloud.resourcemanager.CheckId:
      type: string
      enum:
        - CHECK_ID_UNSPECIFIED
        - CHECK_ID_BILLING_IS_ONLY_ACCOUNT
        - CHECK_ID_BILLING_VALID_ACCOUNT_STATUS
        - CHECK_ID_BILLING_NO_ACTIVE_CONTRACTS
        - CHECK_ID_BILLING_NO_UNPAID_INVOICES
        - CHECK_ID_BILLING_NO_ACTIVE_BILLED_RESOURCES
        - CHECK_ID_BILLING_NO_ACCOUNTS
        - CHECK_ID_IDENTITY_NO_NON_OWNER_REMAINS
        - CHECK_ID_IDENTITY_NO_NON_OWNER_GROUP_REMAINS
        - CHECK_ID_IDENTITY_SSO_NOT_ENABLED
        - CHECK_ID_IDENTITY_SCIM_NOT_ENABLED
        - CHECK_ID_IDENTITY_NO_SERVICE_PRINCIPAL_REMAINS
        - CHECK_ID_RESOURCES_EMPTY
        - CHECK_ID_RESOURCES_NO_PROJECTS_EXIST
        - CHECK_ID_INFRAGRAPH_NO_CONNECTIONS
      default: CHECK_ID_UNSPECIFIED
      description: "Enumerates all supported checks across categories.\n\n - CHECK_ID_BILLING_IS_ONLY_ACCOUNT: BILLING\nIs only account checks that this billing account is this org's\nonly account.\n - CHECK_ID_BILLING_VALID_ACCOUNT_STATUS: Valid account status checks that the billing account has a valid status\neither \"ACTIVE\", \"DELETING\", or \"TRIAL\".\n - CHECK_ID_BILLING_NO_ACTIVE_CONTRACTS: No active contracts checks that the billing account does not have an\nactive Flex or Entitlement contract.\n - CHECK_ID_BILLING_NO_UNPAID_INVOICES: No unpaid invoices checks that the billing account does not have any\nunpaid invoices remaining.\n - CHECK_ID_BILLING_NO_ACTIVE_BILLED_RESOURCES: No active billed resources checks that the billing account does not have\nany billed resources attached to it anymore.\n - CHECK_ID_BILLING_NO_ACCOUNTS: No accounts checks that the organization has no billing accounts\nremaining.\n - CHECK_ID_IDENTITY_NO_NON_OWNER_REMAINS: IDENTITY\n - CHECK_ID_RESOURCES_EMPTY: RESOURCES\n - CHECK_ID_INFRAGRAPH_NO_CONNECTIONS: INFRAGRAPH\nNo connections checks that the organization has no InfraGraph\nconnection resources remaining."
