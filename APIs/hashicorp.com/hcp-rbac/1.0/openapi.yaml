            type: string
          description: Permissions is the set of permissions to test.
        resource_id:
          type: string
          description: "ResourceId holds the unique, immutable and non-reusable ID of the resource.\n\nExample formats include:\n  - vault.cluster:t79BRg8WhTmDPBRM\n  - vagrant.box:gTmD2KMMRt9DWhJz"
        resource_name:
          type: string
          description: "ResourceName holds the Resource Name in the Resource Identifier v2 format.\nThis parameter is expected to be provided only for external calls.\n\nExample formats include:\n  - vault/project/e1e04e11-d590-41cf-b818-1535bc4b4889/cluster/my-cluster\n  - vagrant/organization/ubuntu/box/lunar64/version/v20230130.0.0\n  - iam/organization/zBmk8k7Pk99ph7Kr/service-principal/my-sp-43563412\n  - consul/project/e57a01aa-1929-40e8-80b8-4907fc46429c/cluster/my-cluster\n\nIn case of organization or project level authorization the ResourceName is\nexpected to be provided in the following format:\n  - organization/863063b6-c485-4cf4-8df3-6991a2ffd4b4\n  - project/e1e04e11-d590-41cf-b818-1535bc4b4889\n  - project/gTmD2KMMRt9DWhJz"
      description: AuthorizationTestIamPermissionsRequest is a request to test a set of permissions.
    hashicorp.cloud.resourcemanager.AuthorizationTestIamPermissionsResponse:
      type: object
      properties:
        allowed_permissions:
          type: array
          items:
            type: string
          description: 'AllowedPermissions is the set of permissions granted.

            It is a subset of AuthorizationTestIamPermissionsRequest.Permissions.'
      description: AuthorizationTestIamPermissionsResponse is the set of granted permissions for the AuthorizationTestIamPermissionsRequest.
    hashicorp.cloud.resourcemanager.BatchAuthorizationTestIamPermissionsRequest:
      type: object
      properties:
        resources:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/hashicorp.cloud.resourcemanager.AuthorizationTestIamPermissionsRequest'
              - type: object
          description: resources is the list of resources to test with a set of permissions.
      description: BatchAuthorizationTestIamPermissionsRequest is a request to test a set of permissions for multiple resources.
    hashicorp.cloud.resourcemanager.BatchAuthorizationTestIamPermissionsResponse:
      type: object
      properties:
        resource_permissions:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/hashicorp.cloud.resourcemanager.AuthorizationTestIamPermissionsResponse'
          description: "Request:\n[\n  {\n    Permissions: [...],\n    ResourceId: \"abc123\",\n    ResourceName: \"\",\n  },\n  {\n    Permissions: [...],\n    ResourceId: \"\",\n    ResourceName: \"iam/group/456\"\n  },\n  {\n    Permissions: [...],\n    ResourceId: \"def789\",\n    ResourceName: \"iam/group/789\",\n  },\n]\n\nResponse:\n{\n   \"abc123\": { AllowedPermissions: [...] },\n   \"iam/group/456\": { AllowedPermissions: [...] },\n   \"def789\": { AllowedPermissions: [...] },\n   \"iam/group/789\": { AllowedPermissions: [...] },\n}"
          title: 'resource_permissions is a map of resource_id and/or resource_name to the granted permissions.

            The key is determined by whether or not the resource_id/resource_name is a non-empty string.

            Take for example the following psuedo-code:'
      description: BatchAuthorizationTestIamPermissionsResponse is the set of granted permissions for multiple resources.
