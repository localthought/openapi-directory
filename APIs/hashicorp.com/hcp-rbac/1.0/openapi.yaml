        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hashicorp.cloud.resourcemanager.ResourceGetIamPolicyResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
        - name: resource_name
          description: ResourceName is the resource name of the resource. Either this or the ResourceId needs to be provided.
          in: query
          required: false
          schema:
            type: string
        - name: resource_id
          description: ResourceId is the resource name of the resource. Either this or the ResourceName needs to be provided.
          in: query
          required: false
          schema:
            type: string
      tags:
        - ResourceService
    put:
      summary: 'SetIamPolicy sets the IAM policy for a resource. Since this updates the full policy, the policy takes an "etag"

        argument that should match with the current policy stored in the system. This is to avoid concurrent writes erasing each other''s data.

        Hence, the client should always get the current policy that includes the etag, modify the policy and then set the policy with the same etag.

        If there is no existing policy the etag must be empty.'
      operationId: ResourceService_SetIamPolicy
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hashicorp.cloud.resourcemanager.ResourceSetIamPolicyResponse'
        default:
