      type: object
      required:
        - orgID
        - folderUID
        - ruleGroup
        - title
        - condition
        - data
        - noDataState
        - execErrState
        - for
      properties:
        annotations:
          type: object
          additionalProperties:
            type: string
          example:
            runbook_url: https://supercoolrunbook.com/page/13
        condition:
          type: string
          example: A
        data:
          type: array
          items:
            $ref: '#/components/schemas/AlertQuery'
          example:
            - datasourceUid: __expr__
              model:
                conditions:
                  - evaluator:
                      params:
                        - 0
                        - 0
                      type: gt
                    operator:
                      type: and
                    query:
                      params: []
                    reducer:
                      params: []
                      type: avg
                    type: query
                datasource:
                  type: __expr__
                  uid: __expr__
                expression: 1 == 1
                hide: false
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
                type: math
              queryType: ''
              refId: A
              relativeTimeRange:
                from: 0
                to: 0
        execErrState:
          type: string
          enum:
            - OK
            - Alerting
            - Error
        folderUID:
          type: string
          example: project_x
        for:
          type: string
          format: duration
        id:
          type: integer
          format: int64
        isPaused:
          type: boolean
          example: false
        keep_firing_for:
          type: string
          format: duration
        labels:
          type: object
          additionalProperties:
            type: string
          example:
            team: sre-team-1
        missingSeriesEvalsToResolve:
          type: integer
          format: int64
          example: 2
        noDataState:
          type: string
          enum:
            - Alerting
            - NoData
            - OK
        notification_settings:
          $ref: '#/components/schemas/AlertRuleNotificationSettings'
        orgID:
          type: integer
          format: int64
        provenance:
          $ref: '#/components/schemas/Provenance'
        record:
          $ref: '#/components/schemas/Record'
        ruleGroup:
          type: string
          maxLength: 190
          minLength: 1
          example: eval_group_1
        title:
          type: string
          maxLength: 190
          minLength: 1
          example: Always firing
