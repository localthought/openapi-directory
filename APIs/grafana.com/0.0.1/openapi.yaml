  description: 'The Grafana backend exposes an HTTP API, the same API is used by the frontend to do

    everything from saving dashboards, creating users and updating data sources.'
  title: Grafana HTTP API.
  contact:
    name: Grafana Labs
    url: https://grafana.com
    email: hello@grafana.com
  version: 0.0.1
  x-origin:
    - format: swagger
      url: https://raw.githubusercontent.com/grafana/grafana/9dba45e257b16721d26ea864d9077bb15d1df003/public/api-merged.json
      version: '2.0'
    - format: openapi
      url: https://raw.githubusercontent.com/grafana/grafana/9dba45e257b16721d26ea864d9077bb15d1df003/public/api-merged.json
      version: '3.0'
  x-conversion:
    - Fetched from https://raw.githubusercontent.com/grafana/grafana/9dba45e257b16721d26ea864d9077bb15d1df003/public/api-merged.json at commit 9dba45e257b16721d26ea864d9077bb15d1df003; entry source SHA-256 7aac3090b232eebc23158bb7861e8fc8cdc363a5a46aecfed54db5f4cdef34ca.
    - Converted Swagger 2.0 to OpenAPI 3.0.0 with swagger2openapi 7.0.8 (patch:true, warnOnly:true, resolve:false, targetVersion:3.0.0); 0 warnings and 0 converter patches. External resolution is disabled; the complete converted document must pass validation. Converted SHA-256 6ab1a3305152699b3e45a52c9eeff39179425d5107b22e74f2a7037c5cea8af8.
    - Validated with openapi-spec-validator 0.9.0 with openapi-schema-validator 0.9.0, the Python jsonschema backend, regress 2026.9.1 ECMAScript regex syntax/matching with no flags, and cycle-safe property collection, plus security requirement name resolution across operations, callbacks and webhooks; no schema constraints removed.
    - Preserved existing APIs.guru curation metadata from APIs/grafana.com/0.0.1/openapi.yaml.
    - Serialized as YAML with PyYAML 6.0.3.
paths:
  /access-control/roles:
    get:
      description: 'Gets all existing roles. The response contains all global and organization local roles, for the organization which user is signed in.


        You need to have a permission with action `roles:read` and scope `roles:*`.


        The `delegatable` flag reduces the set of roles to only those for which the signed-in user has permissions to assign.'
      tags:
        - access_control
        - enterprise
      summary: Get all roles.
      operationId: listRoles
      parameters:
        - name: delegatable
          in: query
          schema:
            type: boolean
        - name: includeHidden
          in: query
          schema:
            type: boolean
        - name: targetOrgId
          in: query
          schema:
            type: integer
            format: int64
      responses:
        '200':
          $ref: '#/components/responses/listRolesResponse'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '500':
          $ref: '#/components/responses/internalServerError'
    post:
      description: 'Creates a new custom role and maps given permissions to that role. Note that roles with the same prefix as Fixed Roles can’t be created.


        You need to have a permission with action `roles:write` and scope `permissions:type:delegate`. `permissions:type:delegate` scope ensures that users can only create custom roles with the same, or a subset of permissions which the user has.

        For example, if a user does not have required permissions for creating users, they won’t be able to create a custom role which allows to do that. This is done to prevent escalation of privileges.'
      tags:
        - access_control
        - enterprise
      summary: Create a new custom role.
      operationId: createRole
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleForm'
        required: true
      responses:
        '201':
          $ref: '#/components/responses/createRoleResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '500':
          $ref: '#/components/responses/internalServerError'
  /access-control/roles/{roleUID}:
    get:
      description: 'Get a role for the given UID.


        You need to have a permission with action `roles:read` and scope `roles:*`.'
      tags:
        - access_control
        - enterprise
      summary: Get a role.
      operationId: getRole
      parameters:
        - name: roleUID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/getRoleResponse'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '500':
          $ref: '#/components/responses/internalServerError'
    put:
      description: You need to have a permission with action `roles:write` and scope `permissions:type:delegate`. `permissions:type:delegate` scope ensures that users can only update custom roles with permissions which the user has.
      tags:
        - access_control
        - enterprise
      summary: Update a custom role.
      operationId: updateRole
      parameters:
        - name: roleUID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleCommand'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/getRoleResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '404':
          $ref: '#/components/responses/notFoundError'
        '500':
          $ref: '#/components/responses/internalServerError'
    delete:
      description: 'Delete a role with the given UID, and it’s permissions. If the role is assigned to a built-in role, the deletion operation will fail, unless force query param is set to true, and in that case all assignments will also be deleted.


        You need to have a permission with action `roles:delete` and scope `permissions:type:delegate`.'
      tags:
        - access_control
        - enterprise
      summary: Delete a custom role.
      operationId: deleteRole
      parameters:
        - name: force
          in: query
          schema:
            type: boolean
        - name: global
          in: query
          schema:
            type: boolean
        - name: roleUID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/okResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '500':
          $ref: '#/components/responses/internalServerError'
  /access-control/roles/{roleUID}/assignments:
    get:
      description: 'Get role assignments for the role with the given UID.

        Does not include role assignments mapped through group attribute sync.


        You need to have a permission with action `teams.roles:list` and scope `teams:id:*` and `users.roles:list` and scope `users:id:*`.'
      tags:
        - access_control
        - enterprise
      summary: Get role assignments.
      operationId: getRoleAssignments
      parameters:
        - name: roleUID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/getRoleAssignmentsResponse'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '404':
          $ref: '#/components/responses/notFoundError'
        '500':
          $ref: '#/components/responses/internalServerError'
    put:
      description: 'Set role assignments for the role with the given UID.


        You need to have a permission with action `teams.roles:add` and `teams.roles:remove` and scope `permissions:type:delegate`, and `users.roles:add` and `users.roles:remove` and scope `permissions:type:delegate`.'
      tags:
        - access_control
        - enterprise
      summary: Set role assignments.
      operationId: setRoleAssignments
      parameters:
        - name: roleUID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetRoleAssignmentsCommand'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/setRoleAssignmentsResponse'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '404':
          $ref: '#/components/responses/notFoundError'
        '500':
          $ref: '#/components/responses/internalServerError'
  /access-control/status:
    get:
      description: 'Returns an indicator to check if fine-grained access control is enabled or not.


        You need to have a permission with action `status:accesscontrol` and scope `services:accesscontrol`.'
      tags:
        - access_control
        - enterprise
      summary: Get status.
      operationId: getAccessControlStatus
      responses:
        '200':
          $ref: '#/components/responses/getAccessControlStatusResponse'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '404':
          $ref: '#/components/responses/notFoundError'
        '500':
          $ref: '#/components/responses/internalServerError'
  /access-control/teams/roles/search:
    post:
      description: 'Lists the roles that have been directly assigned to the given teams.


        You need to have a permission with action `teams.roles:read` and scope `teams:id:*`.'
      tags:
        - access_control
        - enterprise
      summary: List roles assigned to multiple teams.
      operationId: listTeamsRoles
      requestBody:
        $ref: '#/components/requestBodies/RolesSearchQuery'
      responses:
        '200':
          $ref: '#/components/responses/listTeamsRolesResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '500':
          $ref: '#/components/responses/internalServerError'
  /access-control/teams/{teamId}/roles:
    get:
      description: You need to have a permission with action `teams.roles:read` and scope `teams:id:<team ID>`.
      tags:
        - access_control
        - enterprise
      summary: Get team roles.
      operationId: listTeamRoles
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: targetOrgId
          in: query
          schema:
            type: integer
            format: int64
      responses:
        '200':
          $ref: '#/components/responses/okResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '500':
          $ref: '#/components/responses/internalServerError'
    put:
      description: You need to have a permission with action `teams.roles:add` and `teams.roles:remove` and scope `permissions:type:delegate` for each. The delegate scope is required for permissions on roles being added.
      tags:
        - access_control
        - enterprise
      summary: Update team role.
      operationId: setTeamRoles
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: targetOrgId
          in: query
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetTeamRolesCommand'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/okResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '404':
          $ref: '#/components/responses/notFoundError'
        '500':
          $ref: '#/components/responses/internalServerError'
    post:
      description: You need to have a permission with action `teams.roles:add` and scope `permissions:type:delegate`.
      tags:
        - access_control
        - enterprise
      summary: Add team role.
      operationId: addTeamRole
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddTeamRoleCommand'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/okResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '404':
          $ref: '#/components/responses/notFoundError'
        '500':
          $ref: '#/components/responses/internalServerError'
  /access-control/teams/{teamId}/roles/{roleUID}:
    delete:
      description: You need to have a permission with action `teams.roles:remove` and scope `permissions:type:delegate`.
      tags:
        - access_control
        - enterprise
      summary: Remove team role.
      operationId: removeTeamRole
      parameters:
        - name: roleUID
          in: path
          required: true
          schema:
            type: string
        - name: teamId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          $ref: '#/components/responses/okResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '404':
          $ref: '#/components/responses/notFoundError'
        '500':
          $ref: '#/components/responses/internalServerError'
  /access-control/users/roles/search:
    post:
      description: 'Lists the roles that have been directly assigned to the given users. The list does not include built-in roles (Viewer, Editor, Admin or Grafana Admin), and it does not include roles that have been inherited from a team.


        You need to have a permission with action `users.roles:read` and scope `users:id:*`.'
      tags:
        - access_control
        - enterprise
      summary: List roles assigned to multiple users.
      operationId: listUsersRoles
      requestBody:
        $ref: '#/components/requestBodies/RolesSearchQuery'
      responses:
        '200':
          $ref: '#/components/responses/listUsersRolesResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '500':
          $ref: '#/components/responses/internalServerError'
  /access-control/users/{userId}/roles:
    get:
      description: 'Lists the roles that have been directly assigned to a given user. The list does not include built-in roles (Viewer, Editor, Admin or Grafana Admin), and it does not include roles that have been inherited from a team.


        You need to have a permission with action `users.roles:read` and scope `users:id:<user ID>`.'
      tags:
        - access_control
        - enterprise
      summary: List roles assigned to a user.
      operationId: listUserRoles
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: includeHidden
          in: query
          schema:
            type: boolean
        - name: targetOrgId
          in: query
          schema:
            type: integer
            format: int64
      responses:
        '200':
          $ref: '#/components/responses/getAllRolesResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '500':
          $ref: '#/components/responses/internalServerError'
    put:
      description: 'Update the user’s role assignments to match the provided set of UIDs. This will remove any assigned roles that aren’t in the request and add roles that are in the set but are not already assigned to the user.

        Roles mapped through group attribute sync are not impacted.

        If you want to add or remove a single role, consider using Add a user role assignment or Remove a user role assignment instead.


        You need to have a permission with action `users.roles:add` and `users.roles:remove` and scope `permissions:type:delegate` for each. The delegate scope is required for permissions on roles being added.'
      tags:
        - access_control
        - enterprise
      summary: Set user role assignments.
      operationId: setUserRoles
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: targetOrgId
          in: query
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetUserRolesCommand'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/okResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '404':
          $ref: '#/components/responses/notFoundError'
        '500':
          $ref: '#/components/responses/internalServerError'
    post:
      description: 'Assign a role to a specific user. For bulk updates consider Set user role assignments.


        You need to have a permission with action `users.roles:add` and scope `permissions:type:delegate`. `permissions:type:delegate` scope ensures that users can only assign roles which have same, or a subset of permissions which the user has. For example, if a user does not have required permissions for creating users, they won’t be able to assign a role which will allow to do that. This is done to prevent escalation of privileges.'
      tags:
        - access_control
        - enterprise
      summary: Add a user role assignment.
      operationId: addUserRole
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddUserRoleCommand'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/okResponse'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '404':
          $ref: '#/components/responses/notFoundError'
        '500':
          $ref: '#/components/responses/internalServerError'
  /access-control/users/{userId}/roles/{roleUID}:
    delete:
      description: 'Revoke a role from a user. For bulk updates consider Set user role assignments.


        You need to have a permission with action `users.roles:remove` and scope `permissions:type:delegate`.'
      tags:
        - access_control
        - enterprise
      summary: Remove a user role assignment.
      operationId: removeUserRole
      parameters:
        - description: A flag indicating if the assignment is global or not. If set to false, the default org ID of the authenticated user will be used from the request to remove assignment.
          name: global
          in: query
          schema:
            type: boolean
        - name: roleUID
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          $ref: '#/components/responses/okResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '404':
          $ref: '#/components/responses/notFoundError'
        '500':
          $ref: '#/components/responses/internalServerError'
  /access-control/{resource}/description:
    get:
      tags:
        - access_control
      summary: Get a description of a resource's access control properties.
      operationId: getResourceDescription
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/resourcePermissionsDescription'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '500':
          $ref: '#/components/responses/internalServerError'
  /access-control/{resource}/{resourceID}:
    get:
      tags:
        - access_control
      summary: Get permissions for a resource.
      operationId: getResourcePermissions
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            type: string
        - name: resourceID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/getResourcePermissionsResponse'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '404':
          $ref: '#/components/responses/notFoundError'
        '500':
          $ref: '#/components/responses/internalServerError'
    post:
      description: 'Assigns permissions for a resource by a given type (`:resource`) and `:resourceID` to one or many

        assignment types. Allowed resources are `datasources`, `teams`, `dashboards`, `folders`, and `serviceaccounts`.

        Refer to the `/access-control/{resource}/description` endpoint for allowed Permissions.'
      tags:
        - access_control
      summary: Set resource permissions.
      operationId: setResourcePermissions
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            type: string
        - name: resourceID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/setPermissionsCommand'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/okResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '404':
          $ref: '#/components/responses/notFoundError'
        '500':
          $ref: '#/components/responses/internalServerError'
  /access-control/{resource}/{resourceID}/builtInRoles/{builtInRole}:
    post:
      description: 'Assigns permissions for a resource by a given type (`:resource`) and `:resourceID` to a built-in role.

        Allowed resources are `datasources`, `teams`, `dashboards`, `folders`, and `serviceaccounts`.

        Refer to the `/access-control/{resource}/description` endpoint for allowed Permissions.'
      tags:
        - access_control
      summary: Set resource permissions for a built-in role.
      operationId: setResourcePermissionsForBuiltInRole
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            type: string
        - name: resourceID
          in: path
          required: true
          schema:
            type: string
        - name: builtInRole
          in: path
          required: true
          schema:
            type: string
      requestBody:
        $ref: '#/components/requestBodies/setPermissionCommand'
      responses:
        '200':
          $ref: '#/components/responses/okResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '404':
          $ref: '#/components/responses/notFoundError'
        '500':
          $ref: '#/components/responses/internalServerError'
  /access-control/{resource}/{resourceID}/teams/{teamID}:
    post:
      description: 'Assigns permissions for a resource by a given type (`:resource`) and `:resourceID` to a team.

        Allowed resources are `datasources`, `teams`, `dashboards`, `folders`, and `serviceaccounts`.

        Refer to the `/access-control/{resource}/description` endpoint for allowed Permissions.'
      tags:
        - access_control
      summary: Set resource permissions for a team.
      operationId: setResourcePermissionsForTeam
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            type: string
        - name: resourceID
          in: path
          required: true
          schema:
            type: string
        - name: teamID
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        $ref: '#/components/requestBodies/setPermissionCommand'
      responses:
        '200':
          $ref: '#/components/responses/okResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '404':
          $ref: '#/components/responses/notFoundError'
        '500':
          $ref: '#/components/responses/internalServerError'
  /access-control/{resource}/{resourceID}/users/{userID}:
    post:
      description: 'Assigns permissions for a resource by a given type (`:resource`) and `:resourceID` to a user or a service account.

        Allowed resources are `datasources`, `teams`, `dashboards`, `folders`, and `serviceaccounts`.

        Refer to the `/access-control/{resource}/description` endpoint for allowed Permissions.'
      tags:
        - access_control
      summary: Set resource permissions for a user.
      operationId: setResourcePermissionsForUser
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            type: string
        - name: resourceID
          in: path
          required: true
          schema:
            type: string
        - name: userID
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        $ref: '#/components/requestBodies/setPermissionCommand'
      responses:
        '200':
          $ref: '#/components/responses/okResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '404':
          $ref: '#/components/responses/notFoundError'
        '500':
          $ref: '#/components/responses/internalServerError'
  /admin/ldap-sync-status:
    get:
      description: You need to have a permission with action `ldap.status:read`.
      tags:
        - admin_ldap
        - enterprise
      summary: Returns the current state of the LDAP background sync integration.
      operationId: getSyncStatus
      responses:
        '200':
          $ref: '#/components/responses/getSyncStatusResponse'
        '401':
          $ref: '#/components/responses/unauthorisedError'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '500':
          $ref: '#/components/responses/internalServerError'
