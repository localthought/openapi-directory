  /v2/task/{task_id}:
    get:
      summary: Get Task
      tags:
      - Tasks
      description: "View information about a task. You can only view task information of tasks you can\
        \ access. \\\n \\\nTasks with attachments will return an \"attachments\" response. \\\n \\\nDocs\
        \ attached to a task are not returned.\\\n \\\nThe `custom_fields` array only includes Custom\
        \ Fields applicable to the task's `custom_item_id`. Use [Get Custom Fields](ref:getaccessiblecustomfields)\
        \ and each field's `applied_objects` to discover which fields apply to which task types."
      operationId: GetTask
      parameters:
      - name: task_id
        in: path
        description: ''
        required: true
        style: simple
        schema:
          type: string
          example: 9hz
      - name: custom_task_ids
        in: query
        description: If you want to reference a task by its custom task id, this value must be `true`.
        style: form
        explode: true
        schema:
          type: boolean
          example: true
      - name: team_id
        in: query
        description: "When the `custom_task_ids` parameter is set to `true`, the Workspace ID must be\
          \ provided using the `team_id` parameter.\n \\\nFor example: `custom_task_ids=true&team_id=123`."
        style: form
        explode: true
        schema:
          type: number
          format: double
          example: 123
      - name: include_subtasks
        in: query
        description: Include subtasks, default false
        style: form
        explode: true
        schema:
          type: boolean
      - name: include_markdown_description
        in: query
        description: To return task descriptions in Markdown format, use `?include_markdown_description=true`.
        style: form
        explode: true
        schema:
          type: boolean
          example: true
      - name: custom_fields
        in: query
        description: "Include tasks with specific values in one or more Custom Fields. Custom Relationships\
          \ are included.\\\n \\\nFor example: `?custom_fields=[{\"field_id\":\"abcdefghi12345678\",\"\
          operator\":\"=\",\"value\":\"1234\"},{\"field_id\":\"jklmnop123456\",\"operator\":\"<\",\"value\"\
          :\"5\"}]`\\\n \\\nOnly set Custom Field values display in the `value` property of the `custom_fields`\
          \ parameter. If you want to include tasks with specific values in only one Custom Field, use\
          \ `custom_field` instead.\\\n \\\nLearn more about [filtering using Custom Fields.](doc:filtertasks)"
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
