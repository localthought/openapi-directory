openapi: 3.0.3
info:
  title: ClickUp API v2 (read-only subset)
  version: v2-readonly
  description: Read-only subset for authorized Workspace discovery and task synchronization. Derived from
    the maintained ClickUp v2 source pinned in source/README.md. The source is OpenAPI 3.1; this document
    converts its schema null unions, numeric contentEncoding annotations, and schema examples to OAS 3.0
    forms. The pinned source task examples do not fully match their response schemas; they are retained
    as published.
  x-origin:
  - format: openapi
    url: https://developer.clickup.com/openapi/clickup-api-v2-reference.json
    version: 3.1.0
  x-providerName: clickup.com
  x-serviceName: v2-readonly
  x-source-commit: f3b0d16b015e11f98aaa78aebfb7d5c954436dbe
  x-source-sha256: 91786855cf012ef7472ba15f86c2e164d69e994a5faae1b584c5338adabbf9de
servers:
- url: https://api.clickup.com/api
  description: ClickUp
  variables: {}
security:
- Authorization_Token: []
paths:
  /v2/team:
    get:
      summary: Get Authorized Workspaces
      tags:
      - Workspaces
      description: View the Workspaces available to the authenticated user.
      operationId: GetAuthorizedTeams
      parameters: []
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                title: GetAuthorizedTeamsresponse
                required:
                - teams
                type: object
                properties:
                  teams:
                    type: array
                    items:
                      title: Team
                      required:
                      - id
                      - name
                      - color
                      - avatar
                      - members
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        color:
                          type: string
                        avatar:
                          type: string
                        members:
                          type: array
                          items:
                            title: Member
                            required:
                            - user
                            type: object
                            properties:
                              user:
                                $ref: '#/components/schemas/SourceSchema_2bc477c5db9d3f50'
                            example:
                              user:
                                id: 123
                                username: John Doe
                                color: '#000000'
                                profilePicture: https://clickup.com/avatar.jpg
                          description: ''
                      example:
                        id: '1234'
                        name: My ClickUp Workspace
                        color: '#000000'
                        avatar: https://clickup.com/avatar.jpg
                        members:
                        - user:
                            id: 123
                            username: John Doe
                            color: '#000000'
                            profilePicture: https://clickup.com/avatar.jpg
                    description: ''
                example:
                  teams:
                  - id: '1234'
                    name: My ClickUp Workspace
                    color: '#000000'
                    avatar: https://clickup.com/avatar.jpg
                    members:
                    - user:
                        id: 123
                        username: John Doe
                        color: '#000000'
                        profilePicture: https://clickup.com/avatar.jpg
              example:
                teams:
                - id: '1234'
                  name: My ClickUp Workspace
                  color: '#000000'
                  avatar: https://clickup.com/avatar.jpg
                  members:
                  - user:
                      id: 123
                      username: John Doe
                      color: '#000000'
                      profilePicture: https://clickup.com/avatar.jpg
      deprecated: false
    parameters: []
  /v2/team/{team_Id}/task:
    get:
      summary: Get Filtered Team Tasks
      tags:
      - Tasks
      description: "View the tasks that meet specific criteria from a Workspace. Responses are limited\
        \ to 100 tasks per page.  \\\n \\\nYou can only view task information of tasks you can access.\
        \ \\\n \\\nEach task's `custom_fields` array only includes Custom Fields applicable to that task's\
        \ `custom_item_id`.\\\n \\\n Our Try It modal currently supports filtering by two or more Lists,\
        \ Folders, or Spaces. To filter by a single List, Folder, or Space, we recommend using a free\
        \ app like [Postman](https://www.postman.com/) to test our public API."
      operationId: GetFilteredTeamTasks
      parameters:
      - name: team_Id
        in: path
        description: Workspace ID
        required: true
        style: simple
        schema:
          type: number
          format: double
          example: 123
      - name: page
        in: query
        description: Page to fetch (starts at 0).
        style: form
        explode: true
        schema:
          type: integer
          format: int32
      - name: order_by
        in: query
        description: "Order by a particular field. By default, tasks are ordered by `created`.\\\n \\\n\
          Options include: `id`, `created`, `updated`, and `due_date`."
        style: form
        explode: true
        schema:
          type: string
      - name: reverse
        in: query
        description: Tasks are displayed in reverse order.
        style: form
        explode: true
        schema:
          type: boolean
      - name: subtasks
        in: query
        description: Include or exclude subtasks. By default, subtasks are excluded.
        style: form
        explode: true
        schema:
          type: boolean
      - name: space_ids[]
        in: query
        description: "Filter by Spaces. For example: \\\n \\\n`?space_ids[]=1234&space_ids[]=6789`"
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: project_ids[]
        in: query
        description: "Filter by Folders. For example: \\\n \\\n`?project_ids[]=1234&project_ids[]=6789`"
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: list_ids[]
        in: query
        description: "Filter by Lists. For example: \\\n \\\n`?list_ids[]=1234&list_ids[]=6789` "
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: statuses[]
        in: query
        description: "Filter by statuses. Use `%20` to represent a space character. To include closed\
          \ tasks, use the `include_closed` parameter. \\\n \\\nFor example: \\\n \\\n`?statuses[]=to%20do&statuses[]=in%20progress`"
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: include_closed
        in: query
        description: "Include or excluse closed tasks. By default, they are excluded.\\\n \\\nTo include\
          \ closed tasks, use `include_closed: true`."
        style: form
        explode: true
        schema:
          type: boolean
      - name: assignees[]
        in: query
        description: "Filter by Assignees using people's ClickUp user id. For example: \\\n \\\n`?assignees[]=1234&assignees[]=5678`"
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: tags[]
        in: query
        description: "Filter by tags. User `%20` to represent a space character. For example: \\\n \\\n\
          `?tags[]=tag1&tags[]=this%20tag`"
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: due_date_gt
        in: query
        description: Filter by due date greater than Unix time in milliseconds.
        style: form
        explode: true
        schema:
          type: integer
          format: int64
      - name: due_date_lt
        in: query
        description: Filter by due date less than Unix time in milliseconds.
        style: form
        explode: true
        schema:
          type: integer
          format: int64
      - name: date_created_gt
        in: query
        description: Filter by date created greater than Unix time in milliseconds.
        style: form
        explode: true
        schema:
          type: integer
          format: int64
      - name: date_created_lt
        in: query
        description: Filter by date created less than Unix time in milliseconds.
        style: form
        explode: true
        schema:
          type: integer
          format: int64
      - name: date_updated_gt
        in: query
        description: Filter by date updated greater than Unix time in milliseconds.
        style: form
        explode: true
        schema:
          type: integer
          format: int64
      - name: date_updated_lt
        in: query
        description: Filter by date updated less than Unix time in milliseconds.
        style: form
        explode: true
        schema:
          type: integer
          format: int64
      - name: date_done_gt
        in: query
        description: Filter by date done greater than Unix time in milliseconds.
        style: form
        explode: true
        schema:
          type: integer
          format: int64
      - name: date_done_lt
        in: query
        description: Filter by date done less than Unix time in milliseconds.
        style: form
        explode: true
        schema:
          type: integer
          format: int64
      - name: custom_fields
        in: query
        description: "Include tasks with specific values in one or more Custom Fields. Custom Relationships\
          \ are included.\\\n \\\nFor example: `?custom_fields=[{\"field_id\":\"abcdefghi12345678\",\"\
          operator\":\"=\",\"value\":\"1234\"}{\"field_id\":\"jklmnop123456\",\"operator\":\"<\",\"value\"\
          :\"5\"}]`\\\n \\\nOnly set Custom Field values display in the `value` property of the `custom_fields`\
          \ parameter. The `=` operator isn't supported with Label Custom Fields.\\\n \\\nLearn more about\
          \ [filtering using Custom Fields.](doc:taskfilters)"
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: parent
        in: query
        description: Include the parent task ID to return subtasks.
        style: form
        explode: true
        schema:
          type: string
      - name: include_markdown_description
        in: query
        description: To return task descriptions in Markdown format, use `?include_markdown_description=true`.
        style: form
        explode: true
        schema:
          type: boolean
          example: true
      - name: custom_items[]
        in: query
        description: "Filter by custom task types. For example: \\\n \\\n`?custom_items[]=0&custom_items[]=1300`\
          \ \\\n \\\nIncluding `0` returns tasks. Including `1` returns Milestones. Including any other\
          \ number returns the custom task type as defined in your Workspace."
        style: form
        explode: true
        schema:
          type: array
          items:
            type: number
      responses:
        '200':
          description: ''
          headers: {}
          content:
