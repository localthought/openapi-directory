name: Official-repository discovery

on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 1 * *'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: maintenance
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: maintenance/requirements.txt
      - run: python -m pip install -r maintenance/requirements.txt
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: maintenance/package-lock.json
      - run: npm ci --prefix maintenance --ignore-scripts --no-audit --no-fund
      - run: python -m unittest discover -s maintenance -v


  discovery:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: maintenance
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: maintenance/requirements.txt
      - run: python -m pip install -r maintenance/requirements.txt
      - run: git fetch origin main
      - run: python maintenance/discovery.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Publish readable discovery queue
        if: always()
        run: |
          if [ -f cache/maintenance/discovery-report.md ]; then
            cat cache/maintenance/discovery-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: official-repository-discovery
          path: |
            cache/maintenance/discovery-report.json
            cache/maintenance/discovery-report.md
            cache/maintenance/discovery/monthly/
          if-no-files-found: warn
