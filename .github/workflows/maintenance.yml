name: Official-source maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
  pull_request:
    paths:
      - 'maintenance/**'
      - '.github/workflows/maintenance.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: maintenance
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: maintenance/requirements.txt
      - run: python -m pip install -r maintenance/requirements.txt
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: maintenance/package-lock.json
      - run: npm ci --prefix maintenance --ignore-scripts --no-audit --no-fund
      - run: python -m unittest discover -s maintenance -v

  audit:
    if: github.event_name != 'pull_request'
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: maintenance
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: maintenance/requirements.txt
      - run: python -m pip install -r maintenance/requirements.txt
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: maintenance/package-lock.json
      - run: npm ci --prefix maintenance --ignore-scripts --no-audit --no-fund
      - run: git fetch origin main
      - run: python maintenance/update.py check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: official-source-audit
          path: cache/maintenance/
          if-no-files-found: warn
